<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>BOXOX</title>
<meta name="description" content="BOXOX">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOXOX">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme:light;
  --bg:#fbfbfa; --surface:#ffffff; --ink:#1b1c1e; --sub:#6c6e73; --faint:#a4a6ab;
  --line:#e6e6e3; --press:#f0f0ed; --accent:#1b1c1e; --on-accent:#ffffff;
  --brass:#a88c5c; --danger:#c8352b; --ok:#3f7d4f; --scrim:rgba(20,20,22,.35);
  --font:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121314; --surface:#1b1c1e; --ink:#ececea; --sub:#9a9ca1; --faint:#686a70;
    --line:#2a2b2e; --press:#232427; --accent:#ececea; --on-accent:#121314;
    --brass:#c7a876; --danger:#ff6b5e; --ok:#63c17d; --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121314; --surface:#1b1c1e; --ink:#ececea; --sub:#9a9ca1; --faint:#686a70;
  --line:#2a2b2e; --press:#232427; --accent:#ececea; --on-accent:#121314;
  --brass:#c7a876; --danger:#ff6b5e; --ok:#63c17d; --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%}

#app{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:max(calc(env(safe-area-inset-bottom,0px) - 16px),0px)}
body.kbopen #app{padding-bottom:0}
.panes{flex:1;min-height:0;display:flex}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column}
#app[data-split]{max-width:1180px;border-inline:1px solid var(--line)}
#side{flex:none;width:300px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.shead{flex:none;height:40px;display:flex;align-items:center;gap:6px;padding:0 4px 0 14px;border-bottom:1px solid var(--line)}
.stitle{flex:1;min-width:0;font-size:14px;font-weight:600}
.sbtns{display:flex;align-items:center;margin-left:auto}
.shead .seg button{height:28px;font-size:12px;padding-inline:12px}
.ssub{flex:none;padding:6px 14px;border-bottom:1px solid var(--line)}
.ssub .seg button{height:26px;font-size:11px;padding-inline:12px}
.slist{flex:1;min-height:0;overflow-y:auto}
.slist .crow,.slist .wrow{cursor:pointer}
.slist .active{background:var(--press);box-shadow:inset 3px 0 0 var(--ink)}
.slist .active .cn,.slist .active .wn{font-weight:600}
#app[data-split] .cdetail,#app[data-split] .cedit{max-width:720px}
.pick-ph{padding:80px 24px;text-align:center;color:var(--faint);font-size:12px}
header{flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);align-items:center;height:40px;padding-inline:4px;border-bottom:1px solid var(--line);background:var(--bg)}
header h1{margin:0;font-size:14px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{height:36px;display:flex;align-items:center;gap:2px;padding-inline:6px;color:var(--ink);font-size:13px;white-space:nowrap}
.hbtn.txt{padding-inline:8px;font-size:14px}
.hbtn.txt.strong{font-weight:600}
.hbtn.on{color:var(--brass)}
.hbtn.danger{color:var(--danger)}
.hbtn:disabled{opacity:.35;cursor:default}
.hbtn svg{width:19px;height:19px}
.hgroup{display:flex;align-items:center}
.hgroup.right{justify-self:end}
.hgroup.left{justify-self:start}
.dot{position:relative}
.dot::after{content:"";position:absolute;top:6px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--danger)}

main{scroll-padding-bottom:24px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* folders */
.folders{list-style:none;margin:0;padding:0}
.folder{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.folder:active,.folder.pressing{background:var(--press)}
.folder svg{flex:none;width:18px;height:18px;color:var(--sub)}
.folder .fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.folder .fname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .fcount{flex:none;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

/* memos */
.memos{list-style:none;margin:0;padding:0}
.memo{padding:7px 14px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:13px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.memos.oneline .memo{padding-block:6px;display:flex;align-items:baseline;gap:8px}
.memo .l1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo .more{flex:none;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.memo .all{display:none;flex:1;min-width:0}
.memo.open{background:var(--press)}
.memo.open .l1,.memo.open .more{display:none}
.memo.open .all{display:block}
.memo.pressing{background:var(--press)}
.memo.flash,.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--press)}to{background:transparent}}

.empty{padding:48px 24px;text-align:center;color:var(--sub);font-size:12px;line-height:1.8}
.empty strong{display:block;color:var(--ink);font-size:13px;font-weight:600;margin-bottom:4px}
.hint{padding:10px 14px 16px;color:var(--faint);font-size:10px;text-align:center}

/* characters: list */
.clist{list-style:none;margin:0;padding:0}
.ghead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:5px 14px 3px;font-size:10px;letter-spacing:.06em;color:var(--sub);background:var(--bg);border-bottom:1px solid var(--line);cursor:pointer;-webkit-user-select:none;user-select:none}
.ghead .gcount{color:var(--faint);font-variant-numeric:tabular-nums}
.ghead .gtitle{display:inline-flex;align-items:center;gap:3px}
.ghead .gtitle svg{width:12px;height:12px;flex:none}
.crow{display:flex;align-items:center;gap:10px;padding:5px 14px;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--bg)}
.crow:active{background:var(--press)}
.crow .ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;color:transparent}
.crow .ck svg{width:12px;height:12px}
.crow.sel{background:var(--press)}
.crow.sel .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.crow .cn{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .handle,.wrow .handle{flex:none;width:36px;height:28px;margin-right:-8px;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab}
.crow .handle svg,.wrow .handle svg{width:18px;height:18px}
.crow.dragging,.wrow.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.av{flex:none;width:28px;height:28px;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{width:78%;height:78%;margin-top:14%}
.av.lg{width:64px;height:64px}

/* characters: detail */
.cdetail{padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
.chead{display:flex;align-items:center;gap:14px}
.chead .cname{font-size:17px;font-weight:600;line-height:1.3}
.chead .calias{font-size:12px;color:var(--sub);margin-top:2px}
.cfields{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:0;border-top:1px solid var(--line)}
.cfields dt,.cfields dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
.cfields dt{color:var(--faint);font-size:11px;padding-top:9px;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.cfields dd{white-space:pre-wrap;word-break:break-word}
.cblock .clabel{font-size:11px;color:var(--faint);margin-bottom:4px}
.cblock .ctext{font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.clinked{margin-top:4px;padding-top:16px;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.clinked .clhead{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.02em}
.clinked .cblock{background:var(--press);border-radius:10px;padding:10px 12px;border-left:3px solid var(--accent)}
.clinked .cblock .clabel{color:var(--accent);font-weight:600;font-size:11.5px}

/* characters: edit */
.cedit{padding:14px 14px 32px;display:flex;flex-direction:column;gap:12px}
.cedit .avrow{display:flex;align-items:center;gap:14px}
.cedit .avbtns{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding-inline:12px;border-radius:15px;background:var(--press);font-size:12px}
.chip.danger{color:var(--danger)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label,.fld .lbl{font-size:11px;color:var(--sub)}
.fld label .req{color:var(--danger);margin-left:3px}
.fld input,.fld textarea,.cf-row input,.cf-row textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;line-height:1.5;padding:7px 10px}
.fld textarea{min-height:120px;resize:vertical}
.fld textarea.mid{min-height:80px}
.fld textarea.song{min-height:36px;resize:none;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cf-list{display:flex;flex-direction:column;gap:8px}
.cf-row{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:5px 4px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px}
.cf-row input{font-size:12px;padding:5px 9px;color:var(--sub)}
.cf-row textarea{grid-column:1 / -1;resize:none;min-height:58px;overflow:hidden}
.cf-row input{grid-column:1;grid-row:1}
.cf-row .del{grid-column:2;grid-row:1;width:28px;height:30px;display:grid;place-items:center;color:var(--faint)}
.cf-row textarea{grid-row:2}
.cf-row .del svg{width:16px;height:16px}
.addfld{align-self:flex-start;display:flex;align-items:center;gap:4px;height:32px;padding-inline:10px;border-radius:8px;border:1px dashed var(--line);font-size:12px;color:var(--sub)}
.addfld svg{width:14px;height:14px}
.delchar{margin-top:10px;align-self:center;font-size:13px;color:var(--danger);padding:8px 14px}

/* world */
.wrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.wrow:active,.wrow.pressing,.ev.pressing,.rrow.pressing{background:var(--press)}
.wrow svg{flex:none;width:18px;height:18px;color:var(--sub)}
.wrow .wn{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .ws{font-size:10px;color:var(--faint);margin-left:6px;font-weight:400}
.wrow .wc{flex:none;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.crow .rc{flex:none;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.evs{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ev.ystart{border-top:1px solid var(--line);margin-top:-1px}
.ey{display:flex;flex-direction:column;font-size:11px;line-height:1.5;color:var(--sub);font-variant-numeric:tabular-nums}
.ey b{font-size:12px;font-weight:600;color:var(--ink)}
.et{font-size:13px;font-weight:500;line-height:1.5;word-break:break-word}
.edt{margin-top:3px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.ec{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.ecc{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--sub)}
.av.sm{width:16px;height:16px}
.av.gav{background:var(--press);color:var(--ink);border-radius:7px;font-size:12px;font-weight:600;line-height:1}
.av.gav.sm{font-size:9px;border-radius:4px}
.av.gav.md{font-size:11px;border-radius:5px}
.av.gav.rm{font-size:18px;border-radius:11px}
.relseg{padding:8px 14px;border-bottom:1px solid var(--line)}
.relseg .seg button{height:30px}
.gmeta{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.gmeta .gdesc{font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.gmeta .clabel{font-size:11px;color:var(--faint);margin-bottom:4px}
.pchip.link{cursor:pointer}
.av.md{width:22px;height:22px}
.evs.line .ev .eb{display:flex;align-items:center;gap:8px;min-width:0}
.evs.line .ev .et{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evs.line .ev .ec{flex:none;margin:0;gap:2px}
.evs.line .ev .ecc span{display:none}
.evs.line .ev .edt{display:none}
.evs.line .ev.open{background:var(--press)}
.evs.line .ev.open .eb{display:block}
.evs.line .ev.open .et{white-space:normal}
.evs.line .ev.open .ec{margin-top:4px;gap:4px 10px}
.evs.line .ev.open .ecc span{display:inline}
.evs.line .ev.open .edt{display:block}
.rlist{list-style:none;margin:0;padding:0}
.rme{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.av.rm{width:44px;height:44px}
.rmt{flex:1;min-width:0}
.rmn{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmn span{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}
.rms{font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmc{flex:none;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.rrow{border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.rrow .rh{display:flex;align-items:center;gap:10px;padding:6px 14px}
.rrow .cn{flex:none;max-width:45%;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rl{flex:1;min-width:0;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rb{display:none;padding:0 14px 10px 52px;flex-direction:column;gap:8px}
.rrow.open{background:var(--press)}
.rrow.open .rb{display:flex}
.rb .rk{font-size:10.5px;color:var(--faint);margin-bottom:1px}
.rb .rv{font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.xlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.xrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.xrow:active{background:var(--press)}
.xrow .xl{flex:1;min-width:0;color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xrow .xev{display:flex;flex-direction:column;gap:1px;min-width:0}
.xrow .xm{font-size:10.5px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{height:34px;padding-inline:12px;font-size:12px;color:var(--sub);background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.yrow{display:flex;gap:8px;align-items:center}
.yrow input{flex:1;min-width:0}
.yrow .yu{font-size:12px;color:var(--sub)}
.fld select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:7px 10px;height:36px}
.pickrow{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:13px}
.pickrow:active{background:var(--press)}
.pickrow .ck{margin-left:auto;flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;color:transparent}
.pickrow .ck svg{width:12px;height:12px}
.pickrow[aria-checked="true"] .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.picklist{display:flex;flex-direction:column;max-height:52vh;overflow-y:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 4px;border-radius:14px;background:var(--press);font-size:12px}
.partner{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;text-align:left;width:100%}
.partner .ph{color:var(--faint)}
.mchoice{display:flex;flex-direction:column;gap:6px;padding:0 6px 4px}
.mchoice button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-align:left}
.mchoice button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mchoice b{font-size:13px}
.mchoice span{font-size:11px;color:var(--sub)}
.sheet .fl{font-size:11px;color:var(--sub);padding:6px 6px 3px}

/* cropper */
.crop{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%;margin:4px auto 6px;overflow:hidden;border-radius:12px;background:#000;touch-action:none;cursor:grab}
.crop img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop .ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 400px rgba(0,0,0,.45);pointer-events:none}
.zoomrow{display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--sub);font-size:11px}
.zoomrow input{flex:1;accent-color:var(--ink)}

/* composer */
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;padding:6px 8px 6px 10px;border-top:1px solid var(--line);background:var(--bg)}
.composer textarea{flex:1;min-height:30px;max-height:38vh;resize:none;border:1px solid var(--line);border-radius:17px;background:var(--surface);color:var(--ink);padding:6px 12px;font:inherit;font-size:13px;line-height:1.45}
.composer textarea::placeholder{color:var(--faint)}
.send{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:opacity .15s}
.send:disabled{opacity:.25;cursor:default}
.send svg{width:16px;height:16px}

/* tabbar */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:2px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 2px;color:var(--faint);font-size:10px;letter-spacing:.04em}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-selected="true"]{color:var(--ink)}

<script>
(function(){
"use strict";
const APP_VERSION='0.9.2';
const KB_KEY='sosaku-kb-extra';
const KB_OPTS=[{v:0,l:'標準'},{v:24,l:'少し上げる'},{v:48,l:'上げる'},{v:72,l:'もっと上げる'}];
function kbExtra(){ try{ return Number(localStorage.getItem(KB_KEY))||0; }catch(e){ return 0; } }
function setKbExtra(v){ try{ localStorage.setItem(KB_KEY,String(v)); }catch(e){} }
const APP_DATE='2026-09-27';
const KEY='sosaku-memo-db-v1';
const TOKEN_KEY='sosaku-gh-token';
const LASTSYNC_KEY='sosaku-last-sync';
const GH={owner:'larg16n-maker',repo:'sosaku-memo-data',path:'data.json',branch:'main'};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ICON={
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/></svg>',
  full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5h14M5 9h14M5 13h14M5 17h9"/></svg>',
  lines:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/></svg>',
  sync:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M13 10l2 2"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 12l6 6 6-6M5 21h14"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V8M6 12l6-6 6 6M5 3h14"/></svg>'
};
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- unicode-safe base64 ---------- */
function b64enc(str){ return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,(m,p)=>String.fromCharCode(parseInt(p,16)))); }
function b64dec(str){ return decodeURIComponent(atob(str).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')); }

/* ---------- data model ---------- */
const COLLS=[['folders','deletedFolders'],['memos','deletedMemos'],['chars','deletedChars'],['timelines','deletedTimelines'],['events','deletedEvents'],['rels','deletedRels'],['groups','deletedGroups'],['grels','deletedGrels'],['questions','deletedQuestions'],['terms','deletedTerms']];
function emptyDb(){ const d={meta:{updatedAt:0}}; for(const [a,b] of COLLS){ d[a]=[]; d[b]=[]; } return d; }
function normalize(d){
  const e=emptyDb();
  if(!d||typeof d!=='object') return e;
  e.meta.updatedAt=(d.meta&&d.meta.updatedAt)||0;
  for(const [a,b] of COLLS){ e[a]=Array.isArray(d[a])?d[a]:[]; e[b]=Array.isArray(d[b])?d[b]:[]; }
  return e;
}
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw));}catch(e){}
  return emptyDb();
}
let db=load();
/* affil (free-text, single) -> affilIds (group id list, multiple). Runs once per char; existing
   free-text values are matched to an existing group of the same name or become a new group. */
function migrateAffiliations(){
  let changed=false;
  for(const c of db.chars){
    if(Array.isArray(c.affilIds)) continue;
    const name=(c.affil||'').trim();
    if(name){
      let g=db.groups.find(x=>(x.name||'').trim()===name);
      if(!g){ const t=Date.now(); g={id:uid(),name,desc:'',createdAt:t,updatedAt:t}; db.groups.push(g); }
      c.affilIds=[g.id];
    }else{
      c.affilIds=[];
    }
    delete c.affil;
    c.updatedAt=Date.now();
    changed=true;
  }
  if(changed) commit();
}
migrateAffiliations();
function save(){ try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('保存できませんでした');} }
function touch(){ db.meta.updatedAt=Date.now(); }
function commit(){ touch(); save(); scheduleSync(); }

/* ---------- merge (for GitHub sync) ---------- */
function mergeCollections(localItems, remoteItems, localDeleted, remoteDeleted){
  const byId=new Map();
  for(const it of remoteItems) byId.set(it.id,{...it});
  for(const it of localItems){
    const ex=byId.get(it.id);
    if(!ex || (it.updatedAt||0) >= (ex.updatedAt||0)) byId.set(it.id,{...it});
  }
  const delMap=new Map();
  for(const d of remoteDeleted) delMap.set(d.id, d.deletedAt||0);
  for(const d of localDeleted) delMap.set(d.id, Math.max(d.deletedAt||0, delMap.get(d.id)||0));
  for(const [id,delAt] of [...delMap]){
    const it=byId.get(id);
    if(it && delAt >= (it.updatedAt||0)) byId.delete(id);
    else if(it) delMap.delete(id);
  }
  return {items:[...byId.values()], deleted:[...delMap].map(([id,deletedAt])=>({id,deletedAt}))};
}
function canon(d){
  const o={}, byId=(a,b)=>a.id<b.id?-1:1;
  for(const [a,b] of COLLS){ o[a]=[...(d[a]||[])].sort(byId); o[b]=[...(d[b]||[])].sort(byId); }
  return JSON.stringify(o);
}
function mergeDb(local, remote){
  if(!remote) return {merged:local, changedFromLocal:false, changedFromRemote:true};
  remote=normalize(remote); local=normalize(local);
  const merged={meta:{updatedAt:Math.max(local.meta.updatedAt||0,remote.meta.updatedAt||0)}};
  for(const [a,b] of COLLS){
    const r=mergeCollections(local[a], remote[a], local[b], remote[b]);
    merged[a]=r.items; merged[b]=r.deleted;
  }
  const changedFromLocal = canon(merged)!==canon(local);
  const changedFromRemote = canon(merged)!==canon(remote);
  return {merged, changedFromLocal, changedFromRemote};
}

/* ---------- GitHub sync ---------- */
function getToken(){ try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return '';} }
function setToken(t){ try{ t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY);}catch(e){} }
function apiUrl(){ return `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`; }

async function ghGet(){
  const token=getToken();
  const res=await fetch(apiUrl()+`?ref=${GH.branch}&t=${Date.now()}`,{
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}
  });
  if(res.status===404) return {json:null, sha:null};
  if(res.status===401) throw new Error('トークンが無効です');
  if(res.status===403) throw new Error('権限がありません（リポジトリとContentsの権限を確認してください）');
  if(!res.ok) throw new Error('取得に失敗しました ('+res.status+')');
  const data=await res.json();
  let text=null;
  if(data.encoding==='base64' && data.content){
    try{ text=b64dec(data.content.replace(/\n/g,'')); }catch(e){ text=null; }
  }
  if(text===null){
    // files over 1MB come back without inline content; fetch the raw file instead
    const raw=await fetch(apiUrl()+`?ref=${GH.branch}&t=${Date.now()}`,{
      headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github.raw+json'}
    });
    if(!raw.ok) throw new Error('取得に失敗しました ('+raw.status+')');
    text=await raw.text();
  }
  let json=null;
  try{ json=JSON.parse(text); }catch(e){ json=null; }
  // never treat an unreadable remote file as "empty" — that would overwrite it
  if(!json) throw new Error('GitHub上のデータを読み込めませんでした。同期を止めています');
  return {json, sha:data.sha};
}
async function ghPut(json, sha){
  const token=getToken();
  const body={
    message:'sync: '+new Date().toISOString(),
    content:b64enc(JSON.stringify(json)),
    branch:GH.branch
  };
  if(sha) body.sha=sha;
  const res=await fetch(apiUrl(),{
    method:'PUT',
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(res.status===401) throw new Error('トークンが無効です');
  if(res.status===403) throw new Error('権限がありません（リポジトリとContentsの権限を確認してください）');
  if(res.status===409) throw new Error('CONFLICT');
  if(!res.ok) throw new Error('保存に失敗しました ('+res.status+')');
  return res.json();
}

let syncing=false, syncTimer=null, sheetOpen=false, pendingRerender=false;
function lastSyncAt(){ try{const v=localStorage.getItem(LASTSYNC_KEY); return v?Number(v):null;}catch(e){return null;} }
function setLastSyncAt(t){ try{localStorage.setItem(LASTSYNC_KEY,String(t));}catch(e){} }

function scheduleSync(){ if(!getToken()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(),1500); }

async function syncNow(){
  const token=getToken();
  if(!token){ updateSyncBadge('off'); return; }
  if(syncing) return;
  syncing=true; updateSyncBadge('syncing');
  try{
    let {json:remote, sha}=await ghGet();
    const {merged, changedFromLocal, changedFromRemote}=mergeDb(db, remote);
    if(changedFromLocal){
      db=merged; save();
      if(sheetOpen) pendingRerender=true; else safeRerender();
    }
    if(changedFromRemote){
      try{
        await ghPut(merged, sha);
      }catch(err){
        if(err.message==='CONFLICT'){
          // someone wrote in between; pull again and retry merge+push once
          const again=await ghGet();
          const r2=mergeDb(db, again.json);
          if(r2.changedFromLocal){ db=r2.merged; save(); if(sheetOpen) pendingRerender=true; else safeRerender(); }
          if(r2.changedFromRemote) await ghPut(r2.merged, again.sha);
        } else throw err;
      }
    }
    setLastSyncAt(Date.now());
    updateSyncBadge('ok');
  }catch(err){
    updateSyncBadge('error', err && err.message);
  }finally{
    syncing=false;
  }
}

function fmtTime(ts){
  if(!ts) return '未同期';
  const d=new Date(ts);
  const now=new Date();
  const sameDay=d.toDateString()===now.toDateString();
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  if(sameDay) return `今日 ${hh}:${mm}`;
  return `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
}

/* ---------- long press ---------- */
// Bound to both main content and the wide-screen side panel, so a folder row can be
// renamed/deleted (long-press) whichever list it's showing in. A side-panel folder row is
// marked with [data-id] on a .wrow (the same attribute name the main .folder rows use);
// world-tab .wrow rows never use data-id, so there's no overlap.
const FOLDER_SEL='.memo,.folder,.wrow[data-id]';
let lp=null;
for(const root of [main, $('#side')]){
  root.addEventListener('pointerdown',e=>{
    const el=e.target.closest(FOLDER_SEL); if(!el) return;
    const x=e.clientX,y=e.clientY;
    el.classList.add('pressing');
    lp={el,x,y,fired:false,timer:setTimeout(()=>{
      lp.fired=true; el.classList.remove('pressing');
      if(navigator.vibrate) try{navigator.vibrate(10)}catch(_){}
      el.classList.contains('memo')?memoMenu(el.dataset.id):folderMenu(el.dataset.id);
    },450)};
  });
  root.addEventListener('pointermove',e=>{ if(lp && Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10){cancelLp(); lp=null;} });
  root.addEventListener('pointerup',e=>{
    if(!lp) return; const {el,fired}=lp; cancelLp(); lp=null;
    if(fired) return;
    if(el.classList.contains('memo')){ if(el.closest('.oneline')) el.classList.toggle('open'); return; }
    folderId=el.dataset.id; render(); toBottom();
  });
  root.addEventListener('pointercancel',()=>{cancelLp(); lp=null;});
  root.addEventListener('contextmenu',e=>{
    const el=e.target.closest(FOLDER_SEL); if(!el) return; e.preventDefault();
    if(lp&&lp.fired) return;
    cancelLp(); lp=null;
    el.classList.contains('memo')?memoMenu(el.dataset.id):folderMenu(el.dataset.id);
  });
  root.addEventListener('keydown',e=>{
    const el=e.target.closest(FOLDER_SEL); if(!el||e.key!=='Enter') return;
    if(el.classList.contains('memo')){ memoMenu(el.dataset.id); return; }
    folderId=el.dataset.id; render(); toBottom();
  });
}
function cancelLp(){ if(lp){clearTimeout(lp.timer); lp.el.classList.remove('pressing');} }

function doExport(){
  try{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date(); const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    a.href=url; a.download=`boxox-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('書き出しました');
  }catch(e){ toast('書き出しに失敗しました'); }
}
function doImport(e){
  const file=e.target.files && e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const incoming=normalize(JSON.parse(reader.result));
      const {merged}=mergeDb(db, incoming);
      db=merged; commit();
      closeSheet(); render();
      toast('読み込みました');
    }catch(err){ toast('読み込みに失敗しました'); }
  };
  reader.readAsText(file);
}

/* Autosave: while editing, changes are written to storage a moment after each edit,
   so nothing is lost if the person leaves without pressing 保存. A character needs a
   name before it's written at all (same rule as the explicit save). */
function commitCharDraft(){
  const d=charDraft; if(!d) return false;
  // Nothing actually changed since the last save (e.g. the editor was just left open in the
  // background) — skip the write entirely so we never re-stamp updatedAt on stale content.
  // Re-stamping unchanged data would make it look "newest" and let it beat a genuinely newer
  // edit made on another device during sync.
  if(!charDirty) return !!charById(d.id);
  const name=(d.name||'').trim();
  if(!name) return false;
  const custom=(d.custom||[]).filter(x=>(x.label||'').trim()||(x.value||'').trim()).map(x=>({...x}));
  const payload=Object.assign({},d,{name,custom,updatedAt:Date.now()});
  // Q&A answers: copy (never share objects with the draft) and drop blanks.
  if(d.qa){ const qa={}; for(const [k,v] of Object.entries(d.qa)) if((v||'').trim()) qa[k]=v; payload.qa=qa; }
  if(d.qx){ payload.qx=d.qx.filter(x=>(x.text||'').trim()||(x.a||'').trim()).map(x=>({...x})); }
  const ex=charById(d.id);
  if(ex){ Object.assign(ex,payload); }
  else{ payload.order=db.chars.reduce((m,c)=>Math.max(m,c.order??0),-1)+1; db.chars.push(payload); }
  charId=d.id; charDirty=false; commit();
  return true;
}
function scheduleCharAutosave(){ clearTimeout(charAutosaveTimer); charAutosaveTimer=setTimeout(commitCharDraft,800); }

function saveCollapsed(){ try{ localStorage.setItem(COLLAPSE_KEY,JSON.stringify([...collapsedGroups])); }catch(e){} }

function charsSorted(){ return [...db.chars].sort((a,b)=>(a.order??0)-(b.order??0)||a.createdAt-b.createdAt); }
function charById(id){ return db.chars.find(c=>c.id===id); }
function avatar(c,cls){
  const k=cls?' '+cls:'';
  if(c.icon) return `<span class="av${k}"><img src="${c.icon}" alt=""></span>`;
  return `<span class="av${k}" style="background:${c.color||AV_COLORS[0]}">${PERSON_SVG}</span>`;
}
function groupsOf(list){
  const out=[];
  for(const g of groupsSorted()){
    const cs=list.filter(c=>(c.affilIds||[]).includes(g.id));
    if(cs.length) out.push([(g.name||'').trim(),cs,g.id]);
  }
  const none=list.filter(c=>!(c.affilIds||[]).length);
  if(none.length) out.push(['',none,null]);
  return out;
}

function autoGrow(t){ t.style.height='auto'; t.style.height=t.scrollHeight+2+'px'; }

function newDraft(){
  const t=Date.now();
  return {id:uid(),name:'',alias:'',age:'',affilIds:[],birthday:'',height:'',song:'',personality:'',history:'',memo:'',custom:[],icon:'',
    color:AV_COLORS[Math.floor(Math.random()*AV_COLORS.length)],createdAt:t,updatedAt:t};
}
function startEdit(c){ charDraft=c?JSON.parse(JSON.stringify(c)):newDraft(); charDirty=false; charView='edit'; render(); main.scrollTop=0; }
function leaveEdit(){
  const back=charById(charDraft.id)?'detail':'list';
  charId=charById(charDraft.id)?charDraft.id:charId;
  charDraft=null; charDirty=false; charView=back; render();
}

$('#charSelectBtn').addEventListener('click',()=>{ selectMode=true; reorderMode=false; selected.clear(); render(); });
$('#charDelSelBtn').addEventListener('click',()=>{
  const n=selected.size; if(!n) return;
  confirmSheet(`${n}人のキャラクターを削除しますか？`,'元に戻せません。','削除',()=>{
    const t=Date.now();
    db.chars=db.chars.filter(c=>{ if(selected.has(c.id)){ db.deletedChars.push({id:c.id,deletedAt:t}); return false; } return true; });
    dropRelsOf(new Set(selected),t);
    selected.clear(); selectMode=false; commit(); render(); toast(n+'人を削除しました');
  });
});
$('#charCancelBtn').addEventListener('click',()=>{
  if(selectMode){ selectMode=false; selected.clear(); render(); return; }
  clearTimeout(charAutosaveTimer); commitCharDraft(); leaveEdit();
});
$('#charSaveBtn').addEventListener('click',()=>{
  clearTimeout(charAutosaveTimer);

  if(!commitCharDraft()){ toast('キャラ名を入力してください'); const n=$('#f_name'); if(n) n.focus(); return; }
  charDraft=null; charView='detail'; render(); toast('保存しました');

/* edit form events */
main.addEventListener('input',e=>{
  if(!inCharDraft()) return;
  const t=e.target;
  if(t.dataset.k){ charDraft[t.dataset.k]=t.value; charDirty=true; if(t.classList.contains('song')) autoGrow(t); scheduleCharAutosave(); }
  else if(t.dataset.cf){
    const row=t.closest('.cf-row'); const f=charDraft.custom.find(x=>x.id===row.dataset.fid);
    if(f){ f[t.dataset.cf]=t.value; charDirty=true; scheduleCharAutosave(); }
    if(t.tagName==='TEXTAREA') autoGrow(t);
  }
  else if(t.dataset.qid && charDraft.qa){ charDraft.qa[t.dataset.qid]=t.value; charDirty=true; autoGrow(t); scheduleCharAutosave(); updQaCount(); }
  else if(t.dataset.qx && charDraft.qx){
    const row=t.closest('[data-qxid]'), x=row&&charDraft.qx.find(v=>v.id===row.dataset.qxid);
    if(x){ x[t.dataset.qx]=t.value; charDirty=true; scheduleCharAutosave(); updQaCount(); }
    if(t.tagName==='TEXTAREA') autoGrow(t);
  }
});
main.addEventListener('click',e=>{
  if(tab!=='chara') return;
  if(charView==='detail'){
    const j=e.target.closest('[data-jump]'); if(j){ jumpFromChar(j); return; }
    const qf=e.target.closest('[data-qfocus]'); if(qf){ startQa(charById(charId),qf.dataset.qfocus); return; }
    const qb=e.target.closest('[data-a]'); if(!qb) return;
    if(qb.dataset.a==='qa'){ startQa(charById(charId)); return; }
    if(qb.dataset.a==='addrel'){ startRelFromChar(charId); return; }
    if(qb.dataset.a==='addev'){ startEvFromChar(charId); return; }
    if(qb.dataset.a==='qatoggle'){ qaOpen=!qaOpen; try{localStorage.setItem(QA_OPEN_KEY,qaOpen?'1':'0');}catch(_){} const st=main.scrollTop; renderChara(); main.scrollTop=st; }
    return;
  }
  if(charView==='qa'){ qaClick(e); return; }
  if(charView==='qtpl'){ qtplClick(e); return; }
  const a=e.target.closest('[data-a]');
  if(charView==='edit' && a){
    const act=a.dataset.a;
    if(act==='addfld'){
      charDraft.custom=charDraft.custom||[]; const f={id:uid(),label:'',value:''}; charDraft.custom.push(f); charDirty=true;
      const st=main.scrollTop; renderChara(); main.scrollTop=st;
      const el=main.querySelector(`[data-fid="${f.id}"] input`); if(el) el.focus();
    }else if(act==='rmfld'){
      const id=a.closest('.cf-row').dataset.fid; charDraft.custom=charDraft.custom.filter(x=>x.id!==id); charDirty=true; scheduleCharAutosave();
      const st=main.scrollTop; renderChara(); main.scrollTop=st;
    }else if(act==='pick'){ $('#iconFile').click(); }
    else if(act==='pickgroups'){ pickGroupsSheet(charDraft.affilIds||[], ids=>{ charDraft.affilIds=ids; charDirty=true; scheduleCharAutosave(); const st=main.scrollTop; renderChara(); main.scrollTop=st; }); }
    else if(act==='rmicon'){ charDraft.icon=''; charDirty=true; scheduleCharAutosave(); const st=main.scrollTop; renderChara(); main.scrollTop=st; }
    else if(act==='delchar'){
      const c=charById(charDraft.id); if(!c) return;
      confirmSheet(`「${c.name}」を削除しますか？`,'元に戻せません。','削除',()=>{
        const t=Date.now(); db.chars=db.chars.filter(x=>x.id!==c.id); db.deletedChars.push({id:c.id,deletedAt:t}); dropRelsOf(new Set([c.id]),t);
        commit(); charDraft=null; charDirty=false; charView='list'; render(); toast('削除しました');
      });
    }
    return;
  }
  if(charView==='list' && !reorderMode){
    const gh=e.target.closest('.ghead[data-gkey]');
    if(gh){ toggleGroupCollapse(gh.dataset.gkey); const st=main.scrollTop; renderChara(); main.scrollTop=st; return; }
  }
  if(charView==='list' && selectMode){
    const r=e.target.closest('.crow'); if(!r) return;
    const id=r.dataset.cid; selected.has(id)?selected.delete(id):selected.add(id);
    const st=main.scrollTop; renderChara(); main.scrollTop=st;
    return;
  }
  if(charView==='list' && !reorderMode){
    const r=e.target.closest('.crow'); if(!r) return;
    charId=r.dataset.cid; charView='detail'; render();
  }
});
main.addEventListener('keydown',e=>{
  if(tab!=='chara'||charView!=='list'||reorderMode||e.key!=='Enter') return;
  const gh=e.target.closest('.ghead[data-gkey]'); if(gh){ toggleGroupCollapse(gh.dataset.gkey); const st=main.scrollTop; renderChara(); main.scrollTop=st; return; }

main.addEventListener('change',e=>{

  const file=e.target.files&&e.target.files[0]; e.target.value='';
  if(file) openCropper(file);

/* ---------- character Q&A ---------- */
// One master question list (db.questions) shared by every character. Each character stores
// only its answers, keyed by question id (c.qa = {questionId: answer}), plus any questions of
// its own (c.qx = [{id,text,a}]). Editing a master question's wording shows up for everyone;
// removing one only hides it — the answers stay on the characters, so undoing brings them back.
const QA_OPEN_KEY='sosaku-qa-open', OWN_CAT='__own__';
let qaOpen=(()=>{try{return localStorage.getItem(QA_OPEN_KEY)==='1';}catch(e){return false;}})();
let qaCat='all', qaUnans=false, qtplBack=null, lastQCat='';
function inCharDraft(){ return tab==='chara' && (charView==='edit'||charView==='qa') && !!charDraft; }
function questionsSorted(){ return [...db.questions].sort((a,b)=>(a.order??0)-(b.order??0)||a.createdAt-b.createdAt); }
function qById(id){ return db.questions.find(q=>q.id===id); }
function nextQOrder(){ return db.questions.reduce((m,q)=>Math.max(m,q.order??0),-1)+1; }
function qCats(){ const seen=[]; for(const q of questionsSorted()){ const c=(q.cat||'').trim(); if(!seen.includes(c)) seen.push(c); } return seen; }
function catLabel(c){ return c||'カテゴリなし'; }
function qaStats(c){
  const qa=c.qa||{}, qx=c.qx||[];
  return { total: db.questions.length+qx.length,
    done: db.questions.filter(q=>(qa[q.id]||'').trim()).length + qx.filter(x=>(x.a||'').trim()).length };
}
function qaBlockHtml(c){
  const {total,done}=qaStats(c), qa=c.qa||{};
  const items=questionsSorted().filter(q=>(qa[q.id]||'').trim()).map(q=>({key:q.id,q:q.text,a:qa[q.id]}))
    .concat((c.qx||[]).filter(x=>(x.a||'').trim()).map(x=>({key:'x:'+x.id,q:(x.text||'').trim()||'（質問なし）',a:x.a})));
  const cnt = total ? `${done} / ${total} 回答済み` : '';
  if(!items.length) return `<div class="qablock"><button type="button" class="qasum" data-a="qa"><span>質問</span><span class="cnt">${cnt}</span><span class="go">答える ›</span></button></div>`;
  return `<div class="qablock"><button type="button" class="qasum" data-a="qatoggle" aria-expanded="${qaOpen}">${qaOpen?CI.chevDown:CI.chevRight}<span>質問</span><span class="cnt">${cnt}</span></button>${qaOpen?`<div class="qaitems">${items.map(it=>`<div class="qi" data-qfocus="${esc(it.key)}"><div class="q">${esc(it.q)}</div><div class="a">${esc(it.a.trim())}</div></div>`).join('')}<button type="button" class="qamore" data-a="qa">回答を編集・続きを答える ›</button></div>`:''}</div>`;
}
function startQa(c,focusKey){
  if(!c) return;
  charDraft=JSON.parse(JSON.stringify(c)); charDraft.qa=charDraft.qa||{}; charDraft.qx=charDraft.qx||[];
  charDirty=false; charId=c.id; charView='qa';
  if(focusKey){ qaCat='all'; qaUnans=false; }
  render(); main.scrollTop=0;
  if(focusKey){
    const box=main.querySelector(`[data-qkey="${CSS.escape(focusKey)}"]`);
    if(box){ box.scrollIntoView({block:'center'}); box.classList.add('flash'); setTimeout(()=>box.classList.remove('flash'),1200); if(isWide()){ const t=box.querySelector('textarea'); if(t) t.focus({preventScroll:true}); } }
  }
}
function finishQa(){ clearTimeout(charAutosaveTimer); commitCharDraft(); charDraft=null; charDirty=false; charView=charById(charId)?'detail':'list'; render(); }
function updQaCount(){ const el=main.querySelector('.qbar .qcnt'); if(el&&charDraft){ const {total,done}=qaStats(charDraft); el.textContent=`${done} / ${total} 回答済み`; } }
function renderQa(){
  const d=charDraft, qa=d.qa, cats=qCats(), hasOwn=d.qx.length>0;
  $('#title').textContent=`${(d.name||'').trim()||'キャラ'}の質問`;
  $('#settingsBtn').hidden=true; $('#backBtn').hidden=false; $('#charDoneBtn').hidden=false;
  if(qaCat===OWN_CAT ? !hasOwn : (qaCat!=='all' && !cats.includes(qaCat))) qaCat='all';
  const {total,done}=qaStats(d);
  const opts=[['all','すべて'],...cats.map(c=>[c,catLabel(c)]),...(hasOwn?[[OWN_CAT,'このキャラだけ']]:[])];
  const pills=opts.length>2||(opts.length===2&&!hasOwn)||(hasOwn&&cats.length)?`<div class="qpills">${opts.map(([v,l])=>`<button type="button" class="chip" data-qcat="${esc(v)}" aria-pressed="${qaCat===v}">${esc(l)}</button>`).join('')}</div>`:'';
  const show=a=>!qaUnans||!(a||'').trim();
  let body='';
  if(qaCat!==OWN_CAT){
    for(const c of cats){
      if(qaCat!=='all' && qaCat!==c) continue;
      const qs=questionsSorted().filter(q=>(q.cat||'').trim()===c && show(qa[q.id]));
      if(!qs.length) continue;
      body+=(cats.length>1&&qaCat==='all'?`<div class="qcat">${esc(catLabel(c))}</div>`:'')
        +qs.map(q=>`<div class="qe" data-qkey="${q.id}"><label class="q" for="qa_${q.id}">${esc(q.text)}</label><textarea id="qa_${q.id}" rows="1" data-qid="${q.id}" placeholder="答えを書く">${esc(qa[q.id]||'')}</textarea></div>`).join('');
    }
  }
  if(qaCat==='all'||qaCat===OWN_CAT){
    const xs=d.qx.filter(x=>show(x.a)||!(x.text||'').trim());
    if(xs.length) body+=(qaCat==='all'&&db.questions.length?'<div class="qcat">このキャラだけ</div>':'')
      +xs.map(x=>`<div class="qe own" data-qkey="x:${x.id}" data-qxid="${x.id}"><div class="qxhead"><input type="text" data-qx="text" value="${esc(x.text||'')}" placeholder="質問" autocomplete="off"><button type="button" class="del" data-a="rmqx" aria-label="この質問を削除">${CI.x}</button></div><textarea rows="1" data-qx="a" placeholder="答えを書く">${esc(x.a||'')}</textarea></div>`).join('');
  }
  if(!body){
    body = !db.questions.length && !d.qx.length
      ? '<div class="empty"><strong>質問テンプレがまだありません</strong>設定の「質問テンプレを編集」から、全キャラ共通の質問リストを作れます。</div>'
      : `<div class="empty">${qaUnans?'未回答の質問はありません':'質問がありません'}</div>`;
  }
  main.innerHTML=`<div class="qaview">
    <div class="qbar"><span class="qcnt">${done} / ${total} 回答済み</span><label class="qtog"><input type="checkbox" data-qunans ${qaUnans?'checked':''}>未回答だけ</label></div>
    ${pills}
    <div class="qlist">${body}</div>
    <div class="qfoot"><button type="button" class="addfld" data-a="addqx">${CI.plus}このキャラだけの質問を追加</button><button type="button" class="qlink" data-a="qtpl">質問テンプレを編集</button></div>
  </div>`;
  main.querySelectorAll('.qaview textarea').forEach(autoGrow);
}
function qaClick(e){
  const pc=e.target.closest('[data-qcat]'); if(pc){ qaCat=pc.dataset.qcat; renderChara(); main.scrollTop=0; return; }
  const a=e.target.closest('[data-a]'); if(!a) return;
  const act=a.dataset.a;
  if(act==='addqx'){
    const x={id:uid(),text:'',a:''}; charDraft.qx.push(x); charDirty=true;
    if(qaCat!=='all'&&qaCat!==OWN_CAT) qaCat='all';
    renderChara();
    const el=main.querySelector(`[data-qxid="${x.id}"] input`); if(el){ el.scrollIntoView({block:'center'}); el.focus(); }
  }else if(act==='rmqx'){
    const id=a.closest('[data-qxid]').dataset.qxid, x=charDraft.qx.find(v=>v.id===id);
    const go=()=>{ charDraft.qx=charDraft.qx.filter(v=>v.id!==id); charDirty=true; scheduleCharAutosave(); const st=main.scrollTop; renderChara(); main.scrollTop=st; };
    (x&&(x.a||'').trim()) ? confirmSheet('この質問を削除しますか？','このキャラの答えも一緒に消えます。','削除',go) : go();
  }else if(act==='qtpl') openQtpl();
}

/* question template (master list) */
function openQtpl(){
  if(tab==='chara' && charView==='qtpl') return;
  if(inCharDraft()){ clearTimeout(charAutosaveTimer); commitCharDraft(); }
  const fromQa = tab==='chara' && charView==='qa';
  const cv = (charView==='edit'||charView==='qa') ? (charById(charId)?'detail':'list') : charView;
  guardLeave(()=>{ qtplBack={tab, cv, qa:fromQa}; tab='chara'; charView='qtpl'; reorderMode=false; selectMode=false; render(); main.scrollTop=0; });
}
function leaveQtpl(){
  const b=qtplBack||{tab:'chara',cv:'list',qa:false}; qtplBack=null;
  tab=b.tab;
  if(b.qa && charById(charId)){ tab='chara'; startQa(charById(charId)); return; }
  charView=(b.cv==='detail'&&!charById(charId))?'list':b.cv; render();
}
function renderQtpl(){
  $('#title').textContent='質問テンプレ';
  $('#settingsBtn').hidden=true; $('#backBtn').hidden=false; $('#qAddBtn').hidden=false;
  const qs=questionsSorted(), cats=qCats();
  const head=`<div class="qtplbar"><span class="small">全キャラ共通の質問リスト（${qs.length}問）。タップで編集、右のつまみで並べ替え。</span><button type="button" class="chip" data-a="qbulk">まとめて追加</button></div>`;
  main.innerHTML=`<div class="qtpl">${head}${!qs.length
    ? '<div class="empty"><strong>まだ質問がありません</strong>右上の＋で1問ずつ、「まとめて追加」で貼り付けて一気に登録できます。</div>'
    : cats.map(c=>`<div class="qcat">${esc(catLabel(c))}</div><ul class="qtlist">${qs.filter(q=>(q.cat||'').trim()===c).map(q=>`<li class="qrow" data-qid="${q.id}" tabindex="0"><span class="qt">${esc(q.text)}</span><span class="handle" aria-label="ドラッグで移動">${CI.grip}</span></li>`).join('')}</ul>`).join('')}</div>`;
}
function qtplClick(e){
  if(e.target.closest('.handle')) return;
  const a=e.target.closest('[data-a]'); if(a&&a.dataset.a==='qbulk'){ bulkSheet(); return; }
  const r=e.target.closest('.qrow'); if(r){ const q=qById(r.dataset.qid); if(q) questionSheet(q); }
}
function applyQOrder(ids){
  const all=questionsSorted().map(q=>q.id), set=new Set(ids);
  const slots=all.map((id,i)=>set.has(id)?i:-1).filter(i=>i>=0);
  slots.forEach((slot,k)=>{ all[slot]=ids[k]; });
  const t=Date.now(); let changed=false;
  all.forEach((id,i)=>{ const q=qById(id); if(q && q.order!==i){ q.order=i; q.updatedAt=t; changed=true; } });
  if(changed) commit();
}
function questionSheet(q){
  const cats=qCats().filter(Boolean);
  openSheet(`<div class="title">${q?'質問を編集':'質問を追加'}</div>
    <textarea id="qText" class="qtext" placeholder="例：休みの日は何をしている？">${esc(q?q.text:'')}</textarea>
    <div class="fl">カテゴリ</div>
    <input id="qCat" type="text" class="plain" maxlength="20" placeholder="例：性格（空欄でもOK）" value="${esc(q?(q.cat||''):lastQCat)}" autocomplete="off">
    ${cats.length?`<div class="chips qcchips">${cats.map(c=>`<button type="button" class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
    ${q?'<div class="small" style="padding-top:8px">削除しても、各キャラの答えは消えません（表示されなくなるだけです）。</div>':''}
    <div class="row">${q?'<button type="button" class="dangerbtn" data-a="del">削除</button>':''}<button type="button" data-a="cancel">キャンセル</button><button type="button" class="primary" data-a="ok">${q?'保存':'追加'}</button></div>`, s=>{
    const tx=s.querySelector('#qText'), ct=s.querySelector('#qCat'), ok=s.querySelector('[data-a=ok]');
    const upd=()=>ok.disabled=!tx.value.trim(); upd(); tx.addEventListener('input',upd);
    s.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ ct.value=b.dataset.c; });
    s.querySelector('[data-a=cancel]').onclick=closeSheet;
    ok.onclick=()=>{
      const text=tx.value.trim(); if(!text) return;
      const cat=ct.value.trim(), t=Date.now(); lastQCat=cat;
      if(q){ const ex=qById(q.id); if(ex){ ex.text=text; ex.cat=cat; ex.updatedAt=t; } }
      else db.questions.push({id:uid(),text,cat,order:nextQOrder(),createdAt:t,updatedAt:t});
      closeSheet(); commit(); render();
    };
    const del=s.querySelector('[data-a=del]');
    if(del) del.onclick=()=>{ closeSheet(); deleteQuestion(q.id); };
    if(!q) tx.focus();
  },'question');
}
function deleteQuestion(id){
  const q=qById(id); if(!q) return;
  const t=Date.now();
  db.questions=db.questions.filter(x=>x.id!==id); db.deletedQuestions.push({id,deletedAt:t});
  commit(); render();
  toastAction('質問を削除しました','元に戻す',()=>{
    if(qById(id)) return;
    db.deletedQuestions=db.deletedQuestions.filter(d=>d.id!==id);
    db.questions.push({...q,updatedAt:Date.now()}); commit(); render(); toast('元に戻しました');
  });
}
function toastAction(msg,label,fn){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const d=document.createElement('div'); d.className='toast act-toast';
  d.innerHTML=`<span>${esc(msg)}</span><button type="button">${esc(label)}</button>`;
  d.querySelector('button').onclick=()=>{ d.remove(); fn(); };
  document.body.appendChild(d); clearTimeout(tt); tt=setTimeout(()=>d.remove(),6000);
}
/* Bulk add: one question per line; "# カテゴリ" / 【カテゴリ】 lines set the category for the
   lines below. Leading numbering / bullets are stripped. A JSON array also works:
   ["質問", ...] or [{"text":"質問","cat":"カテゴリ"}, ...]. */
function parseBulk(text){
  const out=[], t=(text||'').trim(); if(!t) return out;
  if(t[0]==='['||t[0]==='{'){
    try{
      let j=JSON.parse(t); if(!Array.isArray(j)) j=Array.isArray(j.questions)?j.questions:[];
      for(const it of j){
        if(typeof it==='string'){ if(it.trim()) out.push({text:it.trim(),cat:''}); }
        else if(it&&typeof it==='object'){ const tx=String(it.text||it.q||it.question||'').trim(); if(tx) out.push({text:tx,cat:String(it.cat||it.category||'').trim()}); }
      }
      return out;
    }catch(e){ /* not JSON — fall through to line parsing */ }
  }
  let cat='';
  for(let line of t.split(/\r?\n/)){
    line=line.trim(); if(!line) continue;
    const h=line.match(/^#+\s*(.+)$/)||line.match(/^【(.+)】$/)||line.match(/^■\s*(.+)$/);
    if(h){ cat=h[1].trim(); continue; }
    const tx=line.replace(/^(?:Q\s*\d+\s*[.．:：、)）]?\s*|Q\s*[.．:：]\s*|\d+\s*[.．:：、)）]\s*|[・\-*•]\s*)/i,'').trim();
    if(tx) out.push({text:tx,cat});
  }
  return out;
}
function bulkSheet(){
  openSheet(`<div class="title">質問をまとめて追加</div>
    <div class="small" style="padding-bottom:6px">1行に1問ずつ貼り付けてください。「# カテゴリ名」の行を入れると、その下の質問がそのカテゴリになります。先頭の番号や「・」は自動で外します。</div>
    <textarea id="bulkText" placeholder="# 基本&#10;好きな食べ物は？&#10;休みの日は何をしている？&#10;# 性格&#10;怒るとどうなる？"></textarea>
    <div class="small" id="bulkInfo" style="padding-top:6px"></div>
    <div class="row"><button type="button" data-a="cancel">キャンセル</button><button type="button" class="primary" data-a="ok" disabled>追加</button></div>`, s=>{
    const ta=s.querySelector('#bulkText'), info=s.querySelector('#bulkInfo'), ok=s.querySelector('[data-a=ok]');
    const existing=new Set(db.questions.map(q=>(q.text||'').trim()));
    let items=[];
    const upd=()=>{
      const all=parseBulk(ta.value), seen=new Set();
      items=all.filter(x=>{ if(existing.has(x.text)||seen.has(x.text)) return false; seen.add(x.text); return true; });
      const dup=all.length-items.length, nc=new Set(items.map(x=>x.cat).filter(Boolean)).size;
      info.textContent = all.length ? `${items.length}問を追加します${nc?`（${nc}カテゴリ）`:''}${dup?`／重複${dup}問はスキップ`:''}` : '';
      ok.disabled=!items.length;
    };
    ta.addEventListener('input',upd);
    s.querySelector('[data-a=cancel]').onclick=closeSheet;
    ok.onclick=()=>{
      if(!items.length) return;
      let o=nextQOrder(); const t=Date.now();
      for(const it of items) db.questions.push({id:uid(),text:it.text,cat:it.cat,order:o++,createdAt:t,updatedAt:t});
      const n=items.length; closeSheet(); commit(); render(); toast(n+'問を追加しました');
    };
  },'bulk');
}

  if(!e.target.matches('[data-qunans]')) return;
  qaUnans=e.target.checked; renderChara(); main.scrollTop=0;
});
main.addEventListener('keydown',e=>{
  if(tab!=='chara'||charView!=='qtpl'||e.key!=='Enter') return;
  const r=e.target.closest('.qrow'); if(r){ const q=qById(r.dataset.qid); if(q) questionSheet(q); }
});

/* ---------- drag to reorder ---------- */
let drag=null;
main.addEventListener('pointerdown',e=>{
  const charMode = tab==='chara'&&charView==='list'&&reorderMode;
  const grpMode = tab==='world'&&wView==='rchars'&&relKind==='group'&&grpReorderMode;
  const qMode = tab==='chara'&&charView==='qtpl';
  if(!charMode && !grpMode && !qMode) return;
  const h=e.target.closest('.handle'); if(!h) return;
  e.preventDefault();
  const row=h.closest(charMode?'.crow':qMode?'.qrow':'.wrow'), ul=row.parentElement;
  try{h.setPointerCapture(e.pointerId);}catch(_){}
  row.classList.add('dragging');
  drag={row,ul,h,startY:e.clientY,base:row.offsetTop,lastY:e.clientY,pid:e.pointerId,raf:null,kind:charMode?'char':qMode?'q':'group'};
});
function dragMove(y){
  const {row,ul}=drag;
  const sibs=[...ul.children].filter(c=>c!==row);
  let idx=0; for(const s of sibs){ const r=s.getBoundingClientRect(); if(y>r.top+r.height/2) idx++; }
  const cur=[...ul.children].indexOf(row);
  const want=idx;
  if(want!==cur){
    const ref=sibs[want]||null;
    ul.insertBefore(row,ref);
  }
  const shift=row.offsetTop-drag.base;
  row.style.transform=`translateY(${y-drag.startY-shift}px)`;
}
main.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  e.preventDefault();
  drag.lastY=e.clientY; dragMove(e.clientY);
  const mr=main.getBoundingClientRect();
  const edge=40, sp = e.clientY<mr.top+edge ? -8 : e.clientY>mr.bottom-edge ? 8 : 0;
  if(sp && !drag.raf){
    const step=()=>{ if(!drag) return; const before=main.scrollTop; main.scrollTop+=sp; drag.startY-=(main.scrollTop-before); dragMove(drag.lastY);
      const mr2=main.getBoundingClientRect(); const still = drag.lastY<mr2.top+edge||drag.lastY>mr2.bottom-edge;
      drag.raf= still ? requestAnimationFrame(step) : null; };
    drag.raf=requestAnimationFrame(step);
  }
},{passive:false});
function endDrag(){
  if(!drag) return;
  const {row,ul,kind}=drag; if(drag.raf) cancelAnimationFrame(drag.raf);
  row.classList.remove('dragging'); row.style.transform='';
  const newIds=[...ul.children].map(li=>kind==='group'?li.dataset.gid:kind==='q'?li.dataset.qid:li.dataset.cid);
  drag=null;
  kind==='group' ? applyGroupOrder(newIds) : kind==='q' ? applyQOrder(newIds) : applyOrder(newIds);
}
main.addEventListener('pointerup',e=>{ if(drag&&e.pointerId===drag.pid) endDrag(); });
main.addEventListener('pointercancel',e=>{ if(drag&&e.pointerId===drag.pid) endDrag(); });

function applyOrder(groupIds){
  const all=charsSorted().map(c=>c.id);
  const set=new Set(groupIds);
  const slots=all.map((id,i)=>set.has(id)?i:-1).filter(i=>i>=0);
  slots.forEach((slot,k)=>{ all[slot]=groupIds[k]; });
  const t=Date.now(); let changed=false;
  all.forEach((id,i)=>{ const c=charById(id); if(c && c.order!==i){ c.order=i; c.updatedAt=t; changed=true; } });
  if(changed) commit();
}

/* ---------- icon cropper ---------- */
function openCropper(file){
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    openSheet(`<div class="title">アイコンの範囲</div>
      <div class="crop" id="cropBox"><img id="cropImg" alt=""><div class="ring"></div></div>
      <div class="zoomrow"><span>小</span><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="拡大"><span>大</span></div>
      <div class="small" style="text-align:center">ドラッグで位置、2本指またはスライダーで大きさを調整</div>
      <div class="row"><button type="button" data-a="cancel">キャンセル</button><button type="button" class="primary" data-a="ok">決定</button></div>`, s=>{
      const box=s.querySelector('#cropBox'), im=s.querySelector('#cropImg'), zoomEl=s.querySelector('#cropZoom');
      im.src=url;
      const W=img.naturalWidth, H=img.naturalHeight;
      let S=box.clientWidth, base=S/Math.min(W,H), z=1, x=(S-W*base)/2, y=(S-H*base)/2;
      const clamp=()=>{ const sc=base*z; x=Math.min(0,Math.max(S-W*sc,x)); y=Math.min(0,Math.max(S-H*sc,y)); };
      const draw=()=>{ clamp(); im.style.transform=`translate(${x}px,${y}px) scale(${base*z})`; };
      const setZoom=(nz)=>{ nz=Math.min(4,Math.max(1,nz)); const sc0=base*z, sc1=base*nz;
        const cx=(S/2-x)/sc0, cy=(S/2-y)/sc0; x=S/2-cx*sc1; y=S/2-cy*sc1; z=nz; zoomEl.value=String(z); draw(); };
      draw();
      zoomEl.addEventListener('input',()=>setZoom(parseFloat(zoomEl.value)));
      const pts=new Map(); let last=null, pinch0=null;
      box.addEventListener('pointerdown',e=>{ try{box.setPointerCapture(e.pointerId);}catch(_){} pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pts.size===1) last={x:e.clientX,y:e.clientY};
        if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),z}; } });
      box.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pts.size>=2&&pinch0){ const [a,b]=[...pts.values()]; setZoom(pinch0.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d); }
        else if(pts.size===1&&last){ x+=e.clientX-last.x; y+=e.clientY-last.y; last={x:e.clientX,y:e.clientY}; draw(); } });
      const up=e=>{ pts.delete(e.pointerId); pinch0=null; if(pts.size===1){ const p=[...pts.values()][0]; last={x:p.x,y:p.y}; } else last=null; };
      box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
      s.querySelector('[data-a=cancel]').onclick=()=>{ URL.revokeObjectURL(url); closeSheet(); };
      s.querySelector('[data-a=ok]').onclick=()=>{
        const out=200, cv=document.createElement('canvas'); cv.width=out; cv.height=out;
        const ctx=cv.getContext('2d'); const sc=base*z;
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,out,out);
        ctx.drawImage(img,-x/sc,-y/sc,S/sc,S/sc,0,0,out,out);
        let data=''; try{ data=cv.toDataURL('image/jpeg',0.85); }catch(err){}
        URL.revokeObjectURL(url); closeSheet();
        if(!data){ toast('画像を読み込めませんでした'); return; }
        if(charDraft){ charDraft.icon=data; charDirty=true; scheduleCharAutosave(); const st=main.scrollTop; renderChara(); main.scrollTop=st; }
      };
    },'crop');
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('この画像は読み込めませんでした'); };
  img.src=url;
}

};
let wView='hub', tlId=null, rcId=null, rgId=null, relKind='char', evDraft=null, relDraft=null, wDirty=false, wReturn=null;

const openEv=new Set(), openRel=new Set();

function tlById(id){ return db.timelines.find(t=>t.id===id); }
function tlsSorted(){ return [...db.timelines].sort((a,b)=>a.createdAt-b.createdAt); }
function evSort(a,b){ return a.year-b.year || (a.month||0)-(b.month||0) || (a.day||0)-(b.day||0) || a.createdAt-b.createdAt; }
function eventsOf(tid){ return db.events.filter(e=>e.timelineId===tid).sort(evSort); }
function yearLabel(tl,y){
  if(tl.mode==='ad') return y<0 ? '紀元前'+(-y)+'年' : y+'年';
  return y===0 ? '基準年' : y<0 ? (-y)+'年前' : y+'年後';
}
function dateLabel(e){ return e.month ? (e.day ? `${e.month}/${e.day}` : `${e.month}月`) : ''; }
function groupById(id){ return db.groups.find(g=>g.id===id); }
function groupsSorted(){ return [...db.groups].sort((a,b)=>(a.order??0)-(b.order??0)||a.createdAt-b.createdAt); }
function applyGroupOrder(newIds){
  const all=groupsSorted().map(g=>g.id);
  const set=new Set(newIds);
  const slots=all.map((id,i)=>set.has(id)?i:-1).filter(i=>i>=0);
  slots.forEach((slot,k)=>{ all[slot]=newIds[k]; });
  const t=Date.now(); let changed=false;
  all.forEach((id,i)=>{ const g=groupById(id); if(g && g.order!==i){ g.order=i; g.updatedAt=t; changed=true; } });
  if(changed) commit();
}
function gavatar(g,cls){ return `<span class="av gav${cls?' '+cls:''}">${esc(((g&&g.name)||'?').trim().charAt(0)||'?')}</span>`; }
function membersOf(g){ return charsSorted().filter(c=>(c.affilIds||[]).includes(g.id)); }
const RK={
  char:{get:id=>charById(id), coll:'rels', del:'deletedRels', list:()=>charsSorted(), av:(e,c)=>avatar(e,c), view:'rc'},
  group:{get:id=>groupById(id), coll:'grels', del:'deletedGrels', list:()=>groupsSorted(), av:(e,c)=>gavatar(e,c), view:'rg'}
};
function relsOfK(k,id){ const K=RK[k]; return db[K.coll].filter(r=>(r.a===id||r.b===id) && K.get(r.a) && K.get(r.b)); }
function relsOf(cid){ return relsOfK('char',cid); }
function relView(r,cid){ const me=r.a===cid; return {other:me?r.b:r.a, toOther:me?r.ab:r.ba, toMe:me?r.ba:r.ab, callOther:me?r.nab:r.nba, callMe:me?r.nba:r.nab}; }
function dropRelsOf(ids,t){
  db.rels=db.rels.filter(r=>{ if(ids.has(r.a)||ids.has(r.b)){ db.deletedRels.push({id:r.id,deletedAt:t}); return false; } return true; });
}

    const month=d.month?Number(d.month):null, day=month&&d.day?Number(d.day):null;
    const rec={id:d.id,timelineId:d.timelineId,year:d.sign*Number(yabs),month,day,title:d.title.trim(),detail:d.detail,chars:d.chars.filter(id=>charById(id)),createdAt:d.createdAt,updatedAt:t};
    const ex=db.events.find(e=>e.id===d.id);
    ex?Object.assign(ex,rec):db.events.push(rec);
    commit(); evDraft=null; wDirty=false; wView='tl';
    if(backToCharFromWorld()){ toast('保存しました'); return; }
    render(); flashEl(`[data-eid="${rec.id}"]`); toast('保存しました');
    return;
  }
  if(wView==='rel'){
    const d=relDraft, K=RK[d.kind], coll=db[K.coll];
    if(!d.b){ toast('相手を選んでください'); return; }
    const dup=coll.find(r=>r.id!==d.id && ((r.a===d.a&&r.b===d.b)||(r.a===d.b&&r.b===d.a)));
    if(dup){ toast(d.kind==='group'?'この2つのグループの関係はすでにあります':'この2人の関係はすでにあります'); return; }
    const rec={id:d.id,a:d.a,b:d.b,label:d.label.trim(),ab:d.ab,ba:d.ba,detail:d.detail,createdAt:d.createdAt,updatedAt:t};
    if(d.kind==='char'){ rec.nab=(d.nab||'').trim(); rec.nba=(d.nba||'').trim(); }
    const ex=coll.find(r=>r.id===d.id);
    ex?Object.assign(ex,rec):coll.push(rec);
    commit(); relDraft=null; wDirty=false; wView=K.view;
    if(backToCharFromWorld()){ toast('保存しました'); return; }
    render(); flashEl(`[data-rid="${rec.id}"]`); toast('保存しました');
  }
});

/* ---------- world: glossary (単語帳) ---------- */
// Terms are sorted in gojūon order by their reading (or the word itself when no reading is
// given) and grouped under あ/か/さ… headings; anything that doesn't start with kana goes last.
const KANA_ROWS=[['あ','あいうえおぁぃぅぇぉゔ'],['か','かきくけこゕゖ'],['さ','さしすせそ'],['た','たちつてとっ'],['な','なにぬねの'],['は','はひふへほ'],['ま','まみむめも'],['や','やゆよゃゅょ'],['ら','らりるれろ'],['わ','わをんゎゐゑ']];
let termQ='';
const openTm=new Set();
function toHira(s){ return (s||'').replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)); }
function termKey(t){ return toHira(((t.yomi||'').trim()||(t.word||'').trim())).toLowerCase(); }
function kanaRow(t){
  const c=toHira(termKey(t).charAt(0)).normalize('NFD').charAt(0);
  for(const [h,cs] of KANA_ROWS) if(cs.includes(c)) return h;
  return '他';
}
function termsSorted(){ return [...db.terms].sort((a,b)=>termKey(a).localeCompare(termKey(b),'ja')||a.createdAt-b.createdAt); }
function termById(id){ return db.terms.find(t=>t.id===id); }
function termsGrouped(list){
  const rows=[...KANA_ROWS.map(r=>r[0]),'他'], by=new Map(rows.map(r=>[r,[]]));
  for(const t of list) by.get(kanaRow(t)).push(t);
  return rows.filter(r=>by.get(r).length).map(r=>[r,by.get(r)]);
}
function termMatches(t,q){
  if(!q) return true;
  const h=toHira(q.trim().toLowerCase());
  return [t.word,t.yomi,t.desc].some(x=>toHira((x||'').toLowerCase()).includes(h));
}
function termListHtml(){
  const all=termsSorted(), list=all.filter(t=>termMatches(t,termQ));
  if(!all.length) return '<div class="empty"><strong>単語がありません</strong>右上の＋から、作品の中だけの用語・地名・組織名などを登録できます。</div>';
  if(!list.length) return '<div class="empty">見つかりませんでした</div>';
  return termsGrouped(list).map(([h,ts])=>`<div class="tmhead">${h==='他'?'英数・その他':h}</div>`+ts.map(t=>{
    const open=openTm.has(t.id), desc=(t.desc||'').trim();
    return `<div class="tmrow wlp${open?' open':''}" data-tmid="${t.id}" tabindex="0"><div class="tmw"><b>${esc(t.word)}</b>${(t.yomi||'').trim()?`<span class="tmy">${esc(t.yomi.trim())}</span>`:''}</div>${desc?`<div class="tmd">${esc(desc)}</div>`:''}${open?`<div class="tmact"><button type="button" class="chip" data-wa="tmedit">編集</button></div>`:''}</div>`;
  }).join('')).join('')+'<div class="hint">タップで全文、長押しで編集・削除</div>';
}
function renderTerms(){
  main.innerHTML=`<div class="tmview"><div class="tmsearch"><input type="search" id="tmQ" placeholder="単語・読み・説明から検索" value="${esc(termQ)}" autocomplete="off" enterkeyhint="search"></div><div id="tmList">${termListHtml()}</div></div>`;
}
main.addEventListener('input',e=>{
  if(e.target.id!=='tmQ') return;
  termQ=e.target.value; const box=$('#tmList'); if(box) box.innerHTML=termListHtml();
});

    <input id="tmYomi" type="text" class="plain" maxlength="60" placeholder="読み（任意・入れると五十音順に並びます）" value="${esc(t?(t.yomi||''):'')}" autocomplete="off" style="margin-top:6px">

    <div class="row">${t?'<button type="button" class="dangerbtn" data-a="del">削除</button>':''}<button type="button" data-a="cancel">キャンセル</button><button type="button" class="primary" data-a="ok">${t?'保存':'追加'}</button></div>`, s=>{
    const w=s.querySelector('#tmWord'), y=s.querySelector('#tmYomi'), d=s.querySelector('#tmDesc'), ok=s.querySelector('[data-a=ok]');
    const upd=()=>ok.disabled=!w.value.trim(); upd(); w.addEventListener('input',upd);

    ok.onclick=()=>{
      const word=w.value.trim(); if(!word) return;
      if(db.terms.some(x=>x.id!==(t&&t.id) && (x.word||'').trim()===word)){ toast('同じ単語がすでにあります'); w.focus(); return; }
      const now=Date.now(); let id;
      if(t){ const ex=termById(t.id); if(ex){ ex.word=word; ex.yomi=y.value.trim(); ex.desc=d.value; ex.updatedAt=now; } id=t.id; }
      else{ id=uid(); db.terms.push({id,word,yomi:y.value.trim(),desc:d.value,createdAt:now,updatedAt:now}); }
      if(t) openTm.add(id);
      if(!termMatches(termById(id),termQ)) termQ='';
      closeSheet(); commit(); render(); flashEl(`.tmrow[data-tmid="${id}"]`);
    };
    const del=s.querySelector('[data-a=del]');
    if(del) del.onclick=()=>{ closeSheet(); deleteTerm(t.id); };
    if(!t) w.focus();
  },'term');
}
function deleteTerm(id){
  const t=termById(id); if(!t) return;
  db.terms=db.terms.filter(x=>x.id!==id); db.deletedTerms.push({id,deletedAt:Date.now()});
  commit(); render();
  toastAction('単語を削除しました','元に戻す',()=>{
    if(termById(id)) return;
    db.deletedTerms=db.deletedTerms.filter(d=>d.id!==id);
    db.terms.push({...t,updatedAt:Date.now()}); commit(); render(); toast('元に戻しました');
  });
}

/* ---------- character ages on timelines ---------- */
// Each character can have a birth year per timeline (c.born = {timelineId: year}, in that
// timeline's own numbering). Age at an event = event year − birth year, minus one when the
// event's month/day falls before the character's birthday (parsed from the 誕生日 field).
function bornIn(c,tlid){ const v=c&&c.born?c.born[tlid]:undefined; return typeof v==='number'&&isFinite(v)?v:null; }
function parseBirthday(s){ const m=String(s||'').match(/(\d{1,2})\s*(?:月|[\/／.\-])\s*(\d{1,2})?/); return m?{m:+m[1],d:m[2]?+m[2]:null}:null; }
function ageAt(c,tlid,year,month,day){
  const b=bornIn(c,tlid); if(b===null||typeof year!=='number'||!isFinite(year)) return null;
  let age=year-b;
  const bd=parseBirthday(c.birthday); month=Number(month)||0; day=Number(day)||0;
  if(bd && month && (month<bd.m || (month===bd.m && day && bd.d && day<bd.d))) age--;
  return age;
}
function ageLabel(a){ return a===null ? '' : a<0 ? '誕生前' : a+'歳'; }
function evDraftYear(d){ const y=String(d.yabs||'').trim(); return /^\d+$/.test(y) ? d.sign*Number(y) : null; }
function evChipHtml(c,d){
  const a=ageAt(c,d.timelineId,evDraftYear(d),d.month,d.day), known=bornIn(c,d.timelineId)!==null;
  return `<button type="button" class="pchip agechip" data-wa="setborn" data-cid="${c.id}">${avatar(c,'md')}${esc(c.name)}<span class="age${known?'':' unset'}">${known?(a===null?'年を入れると年齢表示':ageLabel(a)):'年齢を設定'}</span></button>`;
}
function updEvAges(){
  if(!evDraft) return;
  main.querySelectorAll('.agechip[data-cid]').forEach(b=>{ const c=charById(b.dataset.cid); if(c) b.outerHTML=evChipHtml(c,evDraft); });
}
function bornSheet(c,tl,evYear,evMonth,evDay){
  const ad=tl.mode==='ad', cur=bornIn(c,tl.id);
  const signs = ad ? [[1,'西暦'],[-1,'紀元前']] : [[-1,'前'],[1,'後']];
  let sign = cur===null ? (ad?1:-1) : cur<0 ? -1 : (ad?1:(cur===0?-1:1));
  const hasEv = typeof evYear==='number';
  openSheet(`<div class="title">${esc(c.name)}の年齢</div>
    <div class="msg">「${esc(tl.name)}」の中で何年に生まれたかを設定すると、この時系列のイベントに年齢が表示されます。</div>
    ${hasEv?`<div class="fl">このイベント（${esc(yearLabel(tl,evYear))}）の時点で</div>
    <div class="yrow"><input id="bornAge" type="text" inputmode="numeric" class="plain" placeholder="例：17" value="${cur===null?'':Math.max(0,evYear-cur)}"><span class="yu">歳</span></div>
    <div class="fl" style="padding-top:12px">または、生まれた年</div>`:'<div class="fl">生まれた年</div>'}
    <div class="yrow"><div class="seg" role="group" id="bornSign">${signs.map(([v,l])=>`<button type="button" data-bs="${v}" aria-pressed="${sign===v}">${l}</button>`).join('')}</div>
      <input id="bornY" type="text" inputmode="numeric" class="plain" value="${cur===null?'':Math.abs(cur)}" placeholder="${ad?'例：1990':'0で基準年'}"><span class="yu">年</span></div>
    <div class="small" style="padding-top:6px">誕生日（${esc((c.birthday||'').trim()||'未入力')}）が入っていれば、月日まで見て年齢を計算します。</div>
    <div class="row">${cur!==null?'<button type="button" class="dangerbtn" data-a="clear">解除</button>':''}<button type="button" data-a="cancel">キャンセル</button><button type="button" class="primary" data-a="ok">保存</button></div>`, s=>{
    const yi=s.querySelector('#bornY'), ai=s.querySelector('#bornAge'), ok=s.querySelector('[data-a=ok]');
    const num=el=>{ const v=el.value.replace(/[^0-9]/g,''); if(v!==el.value) el.value=v; return v===''?null:Number(v); };
    const born=()=>{ const v=num(yi); return v===null?null:sign*v; };
    const setSign=v=>{ sign=v; s.querySelectorAll('#bornSign [data-bs]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.bs)===v)); };
    const upd=()=>{ ok.disabled=born()===null; };
    // Typing an age fills in the birth year (and vice versa) so either can be used.
    if(ai) ai.addEventListener('input',()=>{ const a=num(ai); if(a===null){ upd(); return; } let b=evYear-a;
      // month/day before the birthday means they were born one year earlier
      const bd=parseBirthday(c.birthday), m=Number(evMonth)||0, d=Number(evDay)||0;
      if(bd && m && (m<bd.m || (m===bd.m && d && bd.d && d<bd.d))) b--;
      setSign(b<0?-1:(ad?1:(b===0?sign:1))); yi.value=String(Math.abs(b)); upd(); });
    yi.addEventListener('input',()=>{ num(yi); if(ai){ const b=born(); const a=b===null?null:ageAt({born:{[tl.id]:b},birthday:c.birthday},tl.id,evYear,evMonth,evDay); ai.value=a===null||a<0?'':String(a); } upd(); });
    s.querySelector('#bornSign').addEventListener('click',e=>{ const b=e.target.closest('[data-bs]'); if(!b) return; setSign(Number(b.dataset.bs)); yi.dispatchEvent(new Event('input')); });
    s.querySelector('[data-a=cancel]').onclick=closeSheet;
    const save=v=>{ const ch=charById(c.id); if(!ch) return; ch.born={...(ch.born||{})}; if(v===null) delete ch.born[tl.id]; else ch.born[tl.id]=v; ch.updatedAt=Date.now(); commit(); closeSheet(); updEvAges(); if(!evDraft){ const st=main.scrollTop; render(); main.scrollTop=st; } };
    ok.onclick=()=>{ const b=born(); if(b===null) return; save(b); };
    const clr=s.querySelector('[data-a=clear]'); if(clr) clr.onclick=()=>save(null);
    upd(); (ai||yi).focus();
  },'born');
}
