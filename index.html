  if((el=q('[data-gid]'))) return guardLeave(()=>{ rgId=el.dataset.gid; wView='rg'; render(); main.scrollTop=0; });
  if((el=q('[data-tmid]'))) return guardLeave(()=>{ const id=el.dataset.tmid; wView='terms'; openTm.add(id);
    if(!termMatches(termById(id)||{},termQ)) termQ=''; render(); flashEl(`.tmrow[data-tmid="${id}"]`); });
});
side.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; const el=e.target.closest('[data-scid],[data-tl],[data-src],[data-gid],[data-tmid],.ghead[data-gkey]'); if(el) el.click(); });
const onWideChange=()=>render();
if(WIDE_MQ.addEventListener) WIDE_MQ.addEventListener('change',onWideChange); else if(WIDE_MQ.addListener) WIDE_MQ.addListener(onWideChange);

/* ---------- composer ---------- */
const input=$('#input'), sendBtn=$('#sendBtn');
const DRAFT='sosaku-draft';
function grow(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight, window.innerHeight*.38)+'px'; sendBtn.disabled=!input.value.trim(); }
input.addEventListener('input',()=>{ grow(); try{localStorage.setItem(DRAFT,input.value)}catch(e){} });
input.addEventListener('focus',()=>{ document.body.classList.add('typing'); setTimeout(toBottom,300); });
input.addEventListener('blur',()=>document.body.classList.remove('typing'));
input.addEventListener('keydown',e=>{
  // PC/wide screens: Shift+Enter posts the memo (plain Enter still inserts a newline).
  if(e.key==='Enter' && e.shiftKey && isWide()){ e.preventDefault(); $('#composer').requestSubmit ? $('#composer').requestSubmit() : $('#sendBtn').click(); }
});
$('#composer').addEventListener('submit',e=>{
  e.preventDefault();
  const text=input.value.replace(/\s+$/,''); if(!text.trim()||!folderId) return;
  const t=Date.now();
  db.memos.push({id:uid(),folderId,text,createdAt:t,updatedAt:t}); commit();
  input.value=''; try{localStorage.removeItem(DRAFT)}catch(e){} grow();
  render(); toBottom(); input.focus();
});
sendBtn.addEventListener('pointerdown',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    if(inCharDraft()){ clearTimeout(charAutosaveTimer); commitCharDraft(); }
  }else if(document.visibilityState==='visible'){
    // Refresh from GitHub as soon as this device comes back to the foreground, so editing
    // starts from the latest version instead of whatever was on screen before it went away.
    if(getToken()) syncNow();
  }
});
try{ const d=localStorage.getItem(DRAFT); if(d){input.value=d;} }catch(e){}

/* ---------- iOS keyboard: fit app and sheets to visible area ---------- */
const app=$('#app');
document.addEventListener('focusin',e=>{
  if(!e.target.matches('main input, main textarea, .sheet input, .sheet textarea')) return;
  const el=e.target;
  const nudge=()=>{ try{ el.scrollIntoView({block:'center'}); }catch(_){} };
  // Third-party keyboards (e.g. Simeji) can resize the visual viewport more slowly than
  // Safari's own keyboard, so a single scroll attempt sometimes fires before the keyboard
  // has finished animating in. Retry a couple of times to cover both cases.
  setTimeout(nudge,350); setTimeout(nudge,650);
});
if(window.visualViewport){
  const fit=()=>{ const vv=window.visualViewport, vh=vv.height;
    const kb = vh < window.innerHeight-80;
    document.body.classList.toggle('kbopen',kb);
    if(sheetOpen){
      // A sheet (e.g. settings) is open — leave it alone. Manually repositioning #app/.scrim
      // here was fighting with the browser's own keyboard-avoidance scrolling for inputs
      // inside the sheet and could shove the whole sheet off-screen with no way back. The
      // sheet already scrolls itself (.sheet{overflow-y:auto}) and the focusin handler above
      // nudges the focused field into view within it, so nothing else needs to happen.
      if(app.style.top||app.style.bottom==='auto'||app.style.height){ app.style.top=''; app.style.bottom=''; app.style.height=''; }
      return;
    }
    const h = Math.max(160, vh - (kb?kbExtra():0));
    if(kb){ app.style.top=vv.offsetTop+'px'; app.style.bottom='auto'; app.style.height=h+'px'; window.scrollTo(0,0); }
    else { app.style.top=''; app.style.bottom=''; app.style.height=''; }
  };
  fitSheet=fit;
  visualViewport.addEventListener('resize',fit);
  visualViewport.addEventListener('scroll',fit);
  fit();
}

/* ---------- service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

render(); grow();
if(getToken()) syncNow();
})();
</script>
</body>
</html>
