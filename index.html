<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>創作メモ帳</title>
<meta name="description" content="会話・キャラクター・世界観をまとめる個人用の創作メモ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="創作メモ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme:light;
  --bg:#fbfbfa; --surface:#ffffff; --ink:#1b1c1e; --sub:#6c6e73; --faint:#a4a6ab;
  --line:#e6e6e3; --press:#f0f0ed; --accent:#1b1c1e; --on-accent:#ffffff;
  --brass:#a88c5c; --danger:#c8352b; --ok:#3f7d4f; --scrim:rgba(20,20,22,.35);
  --font:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121314; --surface:#1b1c1e; --ink:#ececea; --sub:#9a9ca1; --faint:#686a70;
    --line:#2a2b2e; --press:#232427; --accent:#ececea; --on-accent:#121314;
    --brass:#c7a876; --danger:#ff6b5e; --ok:#63c17d; --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121314; --surface:#1b1c1e; --ink:#ececea; --sub:#9a9ca1; --faint:#686a70;
  --line:#2a2b2e; --press:#232427; --accent:#ececea; --on-accent:#121314;
  --brass:#c7a876; --danger:#ff6b5e; --ok:#63c17d; --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;overflow:hidden;
  -webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%}

#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg)}
header{flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);align-items:center;height:40px;padding-inline:4px;border-bottom:1px solid var(--line);background:var(--bg)}
header h1{margin:0;font-size:14px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{height:36px;display:flex;align-items:center;gap:2px;padding-inline:6px;color:var(--ink);font-size:13px;white-space:nowrap}
.hbtn.txt{padding-inline:8px;font-size:14px}
.hbtn.txt.strong{font-weight:600}
.hbtn.on{color:var(--brass)}
.hbtn svg{width:19px;height:19px}
.hgroup{display:flex;align-items:center}
.hgroup.right{justify-self:end}
.hgroup.left{justify-self:start}
.dot{position:relative}
.dot::after{content:"";position:absolute;top:6px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--danger)}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* folders */
.folders{list-style:none;margin:0;padding:0}
.folder{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.folder:active,.folder.pressing{background:var(--press)}
.folder svg{flex:none;width:18px;height:18px;color:var(--sub)}
.folder .fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.folder .fname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .fcount{flex:none;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

/* memos */
.memos{list-style:none;margin:0;padding:0}
.memo{padding:7px 14px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:13px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.memos.oneline .memo{padding-block:6px;display:flex;align-items:baseline;gap:8px}
.memo .l1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo .more{flex:none;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.memo .all{display:none;flex:1;min-width:0}
.memo.open{background:var(--press)}
.memo.open .l1,.memo.open .more{display:none}
.memo.open .all{display:block}
.memo.pressing{background:var(--press)}
.memo.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--press)}to{background:transparent}}

.empty{padding:48px 24px;text-align:center;color:var(--sub);font-size:12px;line-height:1.8}
.empty strong{display:block;color:var(--ink);font-size:13px;font-weight:600;margin-bottom:4px}
.hint{padding:10px 14px 16px;color:var(--faint);font-size:10px;text-align:center}

/* characters: list */
.clist{list-style:none;margin:0;padding:0}
.ghead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;padding:5px 14px 3px;font-size:10px;letter-spacing:.06em;color:var(--sub);background:var(--bg);border-bottom:1px solid var(--line)}
.ghead .gcount{color:var(--faint);font-variant-numeric:tabular-nums}
.crow{display:flex;align-items:center;gap:10px;padding:5px 14px;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--bg)}
.crow:active{background:var(--press)}
.crow .cn{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .handle{flex:none;width:36px;height:28px;margin-right:-8px;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab}
.crow .handle svg{width:18px;height:18px}
.crow.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.av{flex:none;width:28px;height:28px;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{width:78%;height:78%;margin-top:14%}
.av.lg{width:64px;height:64px}

/* characters: detail */
.cdetail{padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
.chead{display:flex;align-items:center;gap:14px}
.chead .cname{font-size:17px;font-weight:600;line-height:1.3}
.chead .calias{font-size:12px;color:var(--sub);margin-top:2px}
.cfields{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:0;border-top:1px solid var(--line)}
.cfields dt,.cfields dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
.cfields dt{color:var(--faint);font-size:11px;padding-top:9px;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.cfields dd{white-space:pre-wrap;word-break:break-word}
.cblock .clabel{font-size:11px;color:var(--faint);margin-bottom:4px}
.cblock .ctext{font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}

/* characters: edit */
.cedit{padding:14px 14px 32px;display:flex;flex-direction:column;gap:12px}
.cedit .avrow{display:flex;align-items:center;gap:14px}
.cedit .avbtns{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding-inline:12px;border-radius:15px;background:var(--press);font-size:12px}
.chip.danger{color:var(--danger)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label,.fld .lbl{font-size:11px;color:var(--sub)}
.fld label .req{color:var(--danger);margin-left:3px}
.fld input,.fld textarea,.cf-row input,.cf-row textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;line-height:1.5;padding:7px 10px}
.fld textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cf-list{display:flex;flex-direction:column;gap:8px}
.cf-row{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:5px 4px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px}
.cf-row input{font-size:12px;padding:5px 9px;color:var(--sub)}
.cf-row textarea{grid-column:1 / -1;resize:none;min-height:58px;overflow:hidden}
.cf-row .del{width:28px;height:30px;display:grid;place-items:center;color:var(--faint)}
.cf-row .del svg{width:16px;height:16px}
.addfld{align-self:flex-start;display:flex;align-items:center;gap:4px;height:32px;padding-inline:10px;border-radius:8px;border:1px dashed var(--line);font-size:12px;color:var(--sub)}
.addfld svg{width:14px;height:14px}
.delchar{margin-top:10px;align-self:center;font-size:13px;color:var(--danger);padding:8px 14px}

/* cropper */
.crop{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%;margin:4px auto 6px;overflow:hidden;border-radius:12px;background:#000;touch-action:none;cursor:grab}
.crop img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop .ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 400px rgba(0,0,0,.45);pointer-events:none}
.zoomrow{display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--sub);font-size:11px}
.zoomrow input{flex:1;accent-color:var(--ink)}

/* composer */
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;padding:6px 8px 6px 10px;border-top:1px solid var(--line);background:var(--bg)}
.composer textarea{flex:1;min-height:30px;max-height:38vh;resize:none;border:1px solid var(--line);border-radius:17px;background:var(--surface);color:var(--ink);padding:6px 12px;font:inherit;font-size:13px;line-height:1.45}
.composer textarea::placeholder{color:var(--faint)}
.send{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:opacity .15s}
.send:disabled{opacity:.25;cursor:default}
.send svg{width:16px;height:16px}

/* tabbar */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:2px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 2px;color:var(--faint);font-size:10px;letter-spacing:.04em}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
body.typing nav.tabs{display:none}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s ease-out}
.sheet{width:100%;max-width:640px;background:var(--surface);border-radius:16px 16px 0 0;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;display:flex;flex-direction:column;gap:4px;max-height:88vh;overflow-y:auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet .preview{font-size:12px;color:var(--sub);line-height:1.6;padding:0 6px 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;border-bottom:1px solid var(--line);margin-bottom:4px}
.sheet .title{font-size:14px;font-weight:600;padding:2px 6px 8px}
.sheet .msg{font-size:13px;color:var(--sub);padding:0 6px 10px;line-height:1.6}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:11px 8px;border-radius:10px;font-size:14px;text-align:left}
.act:active{background:var(--press)}
.act svg{width:20px;height:20px;color:var(--sub)}
.act.danger,.act.danger svg{color:var(--danger)}
.sheet textarea,.sheet input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;line-height:1.6;padding:9px 12px}
.sheet textarea{min-height:40vh;resize:none}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;height:42px;border-radius:12px;font-size:14px;font-weight:500;background:var(--press)}
.row button.primary{background:var(--accent);color:var(--on-accent)}
.row button.dangerbtn{background:var(--danger);color:#fff}
.row button:disabled{opacity:.35}

/* settings sheet specifics */
.sec{padding:10px 6px 4px;font-size:11px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.sync-status{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-size:12px;color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:100px;background:var(--press);color:var(--sub)}
.pill.ok{color:var(--ok)}
.pill.err{color:var(--danger)}
.pill .dotstate{width:6px;height:6px;border-radius:50%;background:currentColor}
.sheet a{color:var(--brass)}
.sheet input[type=password], .sheet input[type=text]{font-family:var(--mono);font-size:14px}
.small{font-size:11px;color:var(--faint);line-height:1.6;padding:0 6px}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:18px;z-index:20;animation:fade .15s;max-width:80%;text-align:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header>
    <span class="hgroup left">
      <button class="hbtn" id="backBtn" hidden aria-label="戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="hbtn txt" id="charCancelBtn" hidden>キャンセル</button>
      <button class="hbtn" id="settingsBtn" aria-label="同期設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 000-3l1.9-1.4-2-3.4-2.2.8a7.6 7.6 0 00-2.6-1.5L14 2.5h-4l-.5 2.5a7.6 7.6 0 00-2.6 1.5l-2.2-.8-2 3.4L4.6 10.5a7.6 7.6 0 000 3L2.7 15l2 3.4 2.2-.8c.8.7 1.6 1.2 2.6 1.5l.5 2.5h4l.5-2.5a7.6 7.6 0 002.6-1.5l2.2.8 2-3.4z"/></svg>
      </button>
    </span>
    <h1 id="title">会話</h1>
    <span class="hgroup right">
      <button class="hbtn" id="viewBtn" hidden aria-label="表示を切り替え"></button>
      <button class="hbtn" id="charGroupBtn" hidden aria-label="所属別に表示"></button>
      <button class="hbtn" id="charReorderBtn" hidden aria-label="並べ替え">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/></svg>
      </button>
      <button class="hbtn" id="charAddBtn" hidden aria-label="キャラクターを追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"/><path d="M3 20c.8-3.6 3.5-5.5 7-5.5 1.4 0 2.6.3 3.7.8M18 14v6M15 17h6"/></svg>
      </button>
      <button class="hbtn txt" id="charEditBtn" hidden>編集</button>
      <button class="hbtn txt strong" id="charDoneBtn" hidden>完了</button>
      <button class="hbtn txt strong" id="charSaveBtn" hidden>保存</button>
      <button class="hbtn" id="addFolderBtn" aria-label="フォルダを作る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M12 10.5v5M9.5 13h5"/></svg>
      </button>
    </span>
  </header>
  <main id="main"></main>
  <form class="composer" id="composer" hidden>
    <textarea id="input" rows="1" placeholder="メモを書く" aria-label="メモを書く"></textarea>
    <button class="send" id="sendBtn" type="submit" disabled aria-label="送信">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
  </form>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="talk" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>会話
    </button>
    <button role="tab" data-tab="chara" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>キャラクター
    </button>
    <button role="tab" data-tab="world" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.6 3.5 5.4 3.5 8.5s-1.1 5.9-3.5 8.5c-2.4-2.6-3.5-5.4-3.5-8.5s1.1-5.9 3.5-8.5z"/></svg>世界観
    </button>
  </nav>
</div>

<script>
(function(){
"use strict";
const APP_VERSION='0.2.0';
const APP_DATE='2026-09-27';
const KEY='sosaku-memo-db-v1';
const TOKEN_KEY='sosaku-gh-token';
const LASTSYNC_KEY='sosaku-last-sync';
const GH={owner:'larg16n-maker',repo:'sosaku-memo-data',path:'data.json',branch:'main'};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ICON={
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/></svg>',
  full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5h14M5 9h14M5 13h14M5 17h9"/></svg>',
  lines:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/></svg>',
  sync:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M13 10l2 2"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 12l6 6 6-6M5 21h14"/></svg>',

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- unicode-safe base64 ---------- */
function b64enc(str){ return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,(m,p)=>String.fromCharCode(parseInt(p,16)))); }
function b64dec(str){ return decodeURIComponent(atob(str).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')); }

function normalize(d){
  const e=emptyDb();
  if(!d||typeof d!=='object') return e;
  return {
    meta:{updatedAt:(d.meta&&d.meta.updatedAt)||0},
    folders:Array.isArray(d.folders)?d.folders:[],

}

/* ---------- merge (for GitHub sync) ---------- */
function mergeCollections(localItems, remoteItems, localDeleted, remoteDeleted){
  const byId=new Map();
  for(const it of remoteItems) byId.set(it.id,{...it});
  for(const it of localItems){
    const ex=byId.get(it.id);
    if(!ex || (it.updatedAt||0) >= (ex.updatedAt||0)) byId.set(it.id,{...it});
  }
  const delMap=new Map();
  for(const d of remoteDeleted) delMap.set(d.id, d.deletedAt||0);
  for(const d of localDeleted) delMap.set(d.id, Math.max(d.deletedAt||0, delMap.get(d.id)||0));
  for(const [id,delAt] of [...delMap]){
    const it=byId.get(id);
    if(it && delAt >= (it.updatedAt||0)) byId.delete(id);
    else if(it) delMap.delete(id);
  }
  return {items:[...byId.values()], deleted:[...delMap].map(([id,deletedAt])=>({id,deletedAt}))};
}
function sortedJson(o){ return JSON.stringify(o, Object.keys(o).sort ? undefined : undefined); }
function canon(d){
  return JSON.stringify({
    folders:[...d.folders].sort((a,b)=>a.id<b.id?-1:1),
    memos:[...d.memos].sort((a,b)=>a.id<b.id?-1:1),
    deletedFolders:[...d.deletedFolders].sort((a,b)=>a.id<b.id?-1:1),
    deletedMemos:[...d.deletedMemos].sort((a,b)=>a.id<b.id?-1:1),
    chars:[...(d.chars||[])].sort((a,b)=>a.id<b.id?-1:1),
    deletedChars:[...(d.deletedChars||[])].sort((a,b)=>a.id<b.id?-1:1)
  });
}
function mergeDb(local, remote){
  if(!remote) return {merged:local, changedFromLocal:false, changedFromRemote:true};
  remote=normalize(remote);
  const f=mergeCollections(local.folders, remote.folders||[], local.deletedFolders||[], remote.deletedFolders||[]);
  const m=mergeCollections(local.memos, remote.memos||[], local.deletedMemos||[], remote.deletedMemos||[]);
  const c=mergeCollections(local.chars||[], remote.chars||[], local.deletedChars||[], remote.deletedChars||[]);
  const merged={
    meta:{updatedAt:Math.max((local.meta&&local.meta.updatedAt)||0,(remote.meta&&remote.meta.updatedAt)||0)},
    folders:f.items, deletedFolders:f.deleted,
    memos:m.items, deletedMemos:m.deleted,
    chars:c.items, deletedChars:c.deleted
  };
  const changedFromLocal = canon(merged)!==canon(local);
  const changedFromRemote = canon(merged)!==canon(remote);
  return {merged, changedFromLocal, changedFromRemote};
}

/* ---------- GitHub sync ---------- */
function getToken(){ try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return '';} }
function setToken(t){ try{ t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY);}catch(e){} }
function apiUrl(){ return `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`; }

async function ghGet(){
  const token=getToken();
  const res=await fetch(apiUrl()+`?ref=${GH.branch}&t=${Date.now()}`,{
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}
  });
  if(res.status===404) return {json:null, sha:null};
  if(res.status===401) throw new Error('トークンが無効です');
  if(res.status===403) throw new Error('権限がありません（リポジトリとContentsの権限を確認してください）');
  if(!res.ok) throw new Error('取得に失敗しました ('+res.status+')');
  const data=await res.json();
  let json=null;
  try{ json=JSON.parse(b64dec(data.content.replace(/\n/g,''))); }catch(e){ json=null; }
  return {json, sha:data.sha};
}
async function ghPut(json, sha){
  const token=getToken();
  const body={
    message:'sync: '+new Date().toISOString(),
    content:b64enc(JSON.stringify(json)),
    branch:GH.branch
  };
  if(sha) body.sha=sha;
  const res=await fetch(apiUrl(),{
    method:'PUT',
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(res.status===401) throw new Error('トークンが無効です');
  if(res.status===403) throw new Error('権限がありません（リポジトリとContentsの権限を確認してください）');
  if(res.status===409) throw new Error('CONFLICT');
  if(!res.ok) throw new Error('保存に失敗しました ('+res.status+')');
  return res.json();
}

let syncing=false, syncTimer=null, sheetOpen=false, pendingRerender=false;
function lastSyncAt(){ try{const v=localStorage.getItem(LASTSYNC_KEY); return v?Number(v):null;}catch(e){return null;} }
function setLastSyncAt(t){ try{localStorage.setItem(LASTSYNC_KEY,String(t));}catch(e){} }

function scheduleSync(){ if(!getToken()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(),1500); }

async function syncNow(){
  const token=getToken();
  if(!token){ updateSyncBadge('off'); return; }
  if(syncing) return;
  syncing=true; updateSyncBadge('syncing');
  try{
    let {json:remote, sha}=await ghGet();
    const {merged, changedFromLocal, changedFromRemote}=mergeDb(db, remote);
    if(changedFromLocal){
      db=merged; save();
      if(sheetOpen) pendingRerender=true; else safeRerender();
    }
    if(changedFromRemote){
      try{
        await ghPut(merged, sha);
      }catch(err){
        if(err.message==='CONFLICT'){
          // someone wrote in between; pull again and retry merge+push once
          const again=await ghGet();
          const r2=mergeDb(db, again.json);
          if(r2.changedFromLocal){ db=r2.merged; save(); if(sheetOpen) pendingRerender=true; else safeRerender(); }
          if(r2.changedFromRemote) await ghPut(r2.merged, again.sha);
        } else throw err;
      }
    }
    setLastSyncAt(Date.now());
    updateSyncBadge('ok');
  }catch(err){
    updateSyncBadge('error', err && err.message);
  }finally{
    syncing=false;
  }
}

function fmtTime(ts){
  if(!ts) return '未同期';
  const d=new Date(ts);
  const now=new Date();
  const sameDay=d.toDateString()===now.toDateString();
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  if(sameDay) return `今日 ${hh}:${mm}`;
  return `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
}

    <div class="small">未作成の場合：<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHubでトークンを作る</a>（Repository access を <b>Only select repositories → ${GH.repo}</b> に、Permissions の <b>Contents</b> を <b>Read and write</b> に設定）</div>
    <div class="row"><button type="button" data-a="save" class="primary">保存</button>${has?'<button type="button" data-a="clear" class="dangerbtn">削除</button>':''}</div>

  `, s=>{

function doExport(){
  try{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date(); const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    a.href=url; a.download=`sosaku-memo-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('書き出しました');
  }catch(e){ toast('書き出しに失敗しました'); }
}
function doImport(e){
  const file=e.target.files && e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const incoming=normalize(JSON.parse(reader.result));
      const {merged}=mergeDb(db, incoming);
      db=merged; commit();
      closeSheet(); render();
      toast('読み込みました');
    }catch(err){ toast('読み込みに失敗しました'); }
  };
  reader.readAsText(file);
}

function groupsOf(list){

}

/* ---------- drag to reorder ---------- */
let drag=null;
main.addEventListener('pointerdown',e=>{
  if(!(tab==='chara'&&charView==='list'&&reorderMode)) return;
  const h=e.target.closest('.handle'); if(!h) return;
  e.preventDefault();
  const row=h.closest('.crow'), ul=row.parentElement;
  try{h.setPointerCapture(e.pointerId);}catch(_){}
  row.classList.add('dragging');
  drag={row,ul,h,startY:e.clientY,base:row.offsetTop,lastY:e.clientY,pid:e.pointerId,raf:null};
});
function dragMove(y){
  const {row,ul}=drag;
  const sibs=[...ul.children].filter(c=>c!==row);
  let idx=0; for(const s of sibs){ const r=s.getBoundingClientRect(); if(y>r.top+r.height/2) idx++; }
  const cur=[...ul.children].indexOf(row);
  const want=idx;
  if(want!==cur){
    const ref=sibs[want]||null;
    ul.insertBefore(row,ref);
  }
  const shift=row.offsetTop-drag.base;
  row.style.transform=`translateY(${y-drag.startY-shift}px)`;
}
main.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  e.preventDefault();
  drag.lastY=e.clientY; dragMove(e.clientY);
  const mr=main.getBoundingClientRect();
  const edge=40, sp = e.clientY<mr.top+edge ? -8 : e.clientY>mr.bottom-edge ? 8 : 0;
  if(sp && !drag.raf){
    const step=()=>{ if(!drag) return; const before=main.scrollTop; main.scrollTop+=sp; drag.startY-=(main.scrollTop-before); dragMove(drag.lastY);
      const mr2=main.getBoundingClientRect(); const still = drag.lastY<mr2.top+edge||drag.lastY>mr2.bottom-edge;
      drag.raf= still ? requestAnimationFrame(step) : null; };
    drag.raf=requestAnimationFrame(step);
  }
},{passive:false});
function endDrag(){
  if(!drag) return;
  const {row,ul}=drag; if(drag.raf) cancelAnimationFrame(drag.raf);
  row.classList.remove('dragging'); row.style.transform='';
  const newIds=[...ul.children].map(li=>li.dataset.cid);
  drag=null;
  applyOrder(newIds);
}
main.addEventListener('pointerup',e=>{ if(drag&&e.pointerId===drag.pid) endDrag(); });
main.addEventListener('pointercancel',e=>{ if(drag&&e.pointerId===drag.pid) endDrag(); });

function applyOrder(groupIds){
  const all=charsSorted().map(c=>c.id);
  const set=new Set(groupIds);
  const slots=all.map((id,i)=>set.has(id)?i:-1).filter(i=>i>=0);
  slots.forEach((slot,k)=>{ all[slot]=groupIds[k]; });
  const t=Date.now(); let changed=false;
  all.forEach((id,i)=>{ const c=charById(id); if(c && c.order!==i){ c.order=i; c.updatedAt=t; changed=true; } });
  if(changed) commit();
}

/* ---------- icon cropper ---------- */
function openCropper(file){
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    openSheet(`<div class="title">アイコンの範囲</div>
      <div class="crop" id="cropBox"><img id="cropImg" alt=""><div class="ring"></div></div>
      <div class="zoomrow"><span>小</span><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="拡大"><span>大</span></div>
      <div class="small" style="text-align:center">ドラッグで位置、2本指またはスライダーで大きさを調整</div>
      <div class="row"><button type="button" data-a="cancel">キャンセル</button><button type="button" class="primary" data-a="ok">決定</button></div>`, s=>{
      const box=s.querySelector('#cropBox'), im=s.querySelector('#cropImg'), zoomEl=s.querySelector('#cropZoom');
      im.src=url;
      const W=img.naturalWidth, H=img.naturalHeight;
      let S=box.clientWidth, base=S/Math.min(W,H), z=1, x=(S-W*base)/2, y=(S-H*base)/2;
      const clamp=()=>{ const sc=base*z; x=Math.min(0,Math.max(S-W*sc,x)); y=Math.min(0,Math.max(S-H*sc,y)); };
      const draw=()=>{ clamp(); im.style.transform=`translate(${x}px,${y}px) scale(${base*z})`; };
      const setZoom=(nz)=>{ nz=Math.min(4,Math.max(1,nz)); const sc0=base*z, sc1=base*nz;
        const cx=(S/2-x)/sc0, cy=(S/2-y)/sc0; x=S/2-cx*sc1; y=S/2-cy*sc1; z=nz; zoomEl.value=String(z); draw(); };
      draw();
      zoomEl.addEventListener('input',()=>setZoom(parseFloat(zoomEl.value)));
      const pts=new Map(); let last=null, pinch0=null;
      box.addEventListener('pointerdown',e=>{ try{box.setPointerCapture(e.pointerId);}catch(_){} pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pts.size===1) last={x:e.clientX,y:e.clientY};
        if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),z}; } });
      box.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pts.size>=2&&pinch0){ const [a,b]=[...pts.values()]; setZoom(pinch0.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d); }
        else if(pts.size===1&&last){ x+=e.clientX-last.x; y+=e.clientY-last.y; last={x:e.clientX,y:e.clientY}; draw(); } });
      const up=e=>{ pts.delete(e.pointerId); pinch0=null; if(pts.size===1){ const p=[...pts.values()][0]; last={x:p.x,y:p.y}; } else last=null; };
      box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
      s.querySelector('[data-a=cancel]').onclick=()=>{ URL.revokeObjectURL(url); closeSheet(); };
      s.querySelector('[data-a=ok]').onclick=()=>{
        const out=200, cv=document.createElement('canvas'); cv.width=out; cv.height=out;
        const ctx=cv.getContext('2d'); const sc=base*z;
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,out,out);
        ctx.drawImage(img,-x/sc,-y/sc,S/sc,S/sc,0,0,out,out);
        let data=''; try{ data=cv.toDataURL('image/jpeg',0.85); }catch(err){}
        URL.revokeObjectURL(url); closeSheet();
        if(!data){ toast('画像を読み込めませんでした'); return; }
        if(charDraft){ charDraft.icon=data; charDirty=true; const st=main.scrollTop; renderChara(); main.scrollTop=st; }
      };
    },'crop');
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('この画像は読み込めませんでした'); };
  img.src=url;
}

/* ---------- composer ---------- */
const input=$('#input'), sendBtn=$('#sendBtn');
const DRAFT='sosaku-draft';
function grow(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight, window.innerHeight*.38)+'px'; sendBtn.disabled=!input.value.trim(); }
input.addEventListener('input',()=>{ grow(); try{localStorage.setItem(DRAFT,input.value)}catch(e){} });
input.addEventListener('focus',()=>{ document.body.classList.add('typing'); setTimeout(toBottom,300); });
input.addEventListener('blur',()=>document.body.classList.remove('typing'));
$('#composer').addEventListener('submit',e=>{
  e.preventDefault();
  const text=input.value.replace(/\s+$/,''); if(!text.trim()||!folderId) return;
  const t=Date.now();
  db.memos.push({id:uid(),folderId,text,createdAt:t,updatedAt:t}); commit();
  input.value=''; try{localStorage.removeItem(DRAFT)}catch(e){} grow();
  render(); toBottom(); input.focus();
});
sendBtn.addEventListener('pointerdown',e=>e.preventDefault());
try{ const d=localStorage.getItem(DRAFT); if(d){input.value=d;} }catch(e){}

/* ---------- iOS keyboard: fit app and sheets to visible area ---------- */
const app=$('#app');
if(window.visualViewport){
  const fit=()=>{ const vv=window.visualViewport, vh=vv.height;
    const kb = vh < window.innerHeight-80;
    if(kb){ app.style.height=vh+'px'; window.scrollTo(0,0); } else app.style.height='';
    if(scrim){ scrim.style.top=(kb?vv.offsetTop:0)+'px'; scrim.style.height=kb?vh+'px':''; scrim.style.bottom=kb?'auto':''; }
  };
  fitSheet=fit;
  visualViewport.addEventListener('resize',fit);
  visualViewport.addEventListener('scroll',fit);
  fit();
}

/* ---------- service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

render(); grow();
if(getToken()) syncNow();
})();
</script>
</body>
</html>
